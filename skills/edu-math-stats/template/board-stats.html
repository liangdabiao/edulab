<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.8/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.8/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.8/contrib/auto-render.min.js"></script>
    <style>
        body { background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

</head>
<body class="min-h-screen lg:h-screen text-slate-800 lg:overflow-hidden">
<div class="flex flex-col lg:flex-row gap-3 p-3 min-h-screen lg:h-screen lg:overflow-hidden">

    <!-- ===== 左栏：题目 + 交互控制台 ===== -->
    <aside class="w-full lg:w-[340px] flex-shrink-0 flex flex-col gap-3 lg:overflow-hidden">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-300 p-5 flex-shrink-0">
            <h2 id="prob-title" class="text-xl font-bold mb-4 text-slate-900"></h2>
            <div id="prob-body" class="prose text-slate-600 leading-relaxed space-y-3 text-sm md:text-base"></div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-300 p-5 lg:flex-1 lg:min-h-0 lg:overflow-y-auto">
            <h3 class="text-base font-bold text-slate-900 flex items-center gap-2 mb-4">
                <span class="w-2.5 h-2.5 bg-blue-500 rounded-full"></span>
                <span id="console-title">动态控制台</span>
            </h3>
            <div class="space-y-6">
                <div id="param-block" class="hidden">
                    <div class="flex justify-between items-center mb-2">
                        <label id="param-label" class="text-sm font-semibold text-slate-600"></label>
                        <span id="param-val" class="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-md text-xs font-mono font-bold border border-blue-100"></span>
                    </div>
                    <input type="range" id="param-slider" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 focus:outline-none">
                    <div id="param-ticks" class="flex justify-between text-[11px] text-slate-400 mt-1.5 font-mono"></div>
                </div>
                <div id="readouts" class="bg-slate-50 border border-slate-200/60 rounded-xl p-4 space-y-3 text-xs md:text-sm font-mono text-slate-700"></div>
            </div>
            <div id="constant-block" class="hidden mt-6 border-t border-slate-100 pt-4">
                <div class="flex items-center gap-2 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3 text-sm">
                    <span class="text-emerald-600">\u{1F4A1}</span>
                    <span class="text-slate-700">拖动滑块，下方数值恒为定值</span>
                    <span id="constant-val" class="ml-auto font-bold text-emerald-700"></span>
                </div>
            </div>
        </div>
    </aside>

    <!-- ===== 中栏：分步解析 ===== -->
    <section id="solution-panel" class="w-full lg:w-[360px] flex-shrink-0 lg:overflow-y-auto bg-white rounded-2xl shadow-sm border border-slate-300 p-5 space-y-5 transition-[width] duration-300">
        <div id="sol-header" class="flex items-center justify-between gap-2">
            <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-indigo-500 rounded-full"></span>
                <span id="sol-title-text">详细解析</span>
            </h3>
            <button id="toggle-solution" type="button" title="收起解析" class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg border border-slate-300 bg-slate-50 text-slate-500 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-600 transition-colors cursor-pointer">
                <svg id="sol-chevron" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span id="sol-vlabel" class="hidden font-bold text-slate-700 text-sm tracking-widest [writing-mode:vertical-rl]">详细解析</span>
        </div>
        <div id="solution-body" class="space-y-5"></div>
    </section>

    <!-- ===== 右栏：函数图像画板 ===== -->
    <main class="w-full lg:flex-1 min-w-0 bg-white rounded-2xl shadow-sm border border-slate-300 p-5 flex flex-col lg:overflow-hidden">
        <div class="flex justify-between items-center mb-4 flex-shrink-0">
            <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                统计 · 动态交互
            </h3>
            <button onclick="resetPlot()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">重置</button>
        </div>
        <div class="relative flex-grow min-h-[360px] lg:min-h-0 bg-white rounded-xl overflow-hidden shadow-inner flex items-center justify-center">
            <canvas id="geometry-canvas" class="absolute inset-0 w-full h-full"></canvas>
            <canvas id="draw-canvas" class="absolute inset-0 w-full h-full" style="pointer-events:none; touch-action:none;"></canvas>
            <!-- 画笔工具栏 -->
            <div class="absolute top-4 right-4 z-10 flex items-center gap-1 bg-white/90 backdrop-blur-md p-1.5 rounded-xl border border-slate-200 shadow-lg">
                <button id="pen-btn" type="button" title="画笔" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors cursor-pointer">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 20h9"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                </button>
                <button id="eraser-btn" type="button" title="橡皮擦" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors cursor-pointer">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 21-4.3-4.3a1.7 1.7 0 0 1 0-2.4l9.6-9.6a1.7 1.7 0 0 1 2.4 0l5.6 5.6a1.7 1.7 0 0 1 0 2.4L13 21"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M22 21H7M5 11l8 8"/></svg>
                </button>
                <span class="w-px h-5 bg-slate-200 mx-0.5"></span>
                <div class="flex items-center gap-1">
                    <button type="button" class="draw-swatch w-5 h-5 rounded-full cursor-pointer ring-2 ring-slate-400" data-color="#1e293b" style="background:#1e293b" title="黑色"></button>
                    <button type="button" class="draw-swatch w-5 h-5 rounded-full cursor-pointer ring-1 ring-slate-300" data-color="#dc2626" style="background:#dc2626" title="红色"></button>
                    <button type="button" class="draw-swatch w-5 h-5 rounded-full cursor-pointer ring-1 ring-slate-300" data-color="#2563eb" style="background:#2563eb" title="蓝色"></button>
                    <button type="button" class="draw-swatch w-5 h-5 rounded-full cursor-pointer ring-1 ring-slate-300" data-color="#059669" style="background:#059669" title="绿色"></button>
                </div>
                <span class="w-px h-5 bg-slate-200 mx-0.5"></span>
                <input id="pen-size" type="range" min="1" max="14" value="3" title="画笔粗细" class="w-14 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-600">
                <span class="w-px h-5 bg-slate-200 mx-0.5"></span>
                <button id="undo-btn" type="button" title="撤销" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors cursor-pointer">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14 4 9l5-5"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg>
                </button>
                <button id="clear-draw-btn" type="button" title="清除涂鸦" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-300 hover:bg-rose-600 hover:text-white transition-colors cursor-pointer">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
            <!-- 图例 -->
            <div id="legend" class="absolute bottom-4 left-4 pointer-events-none bg-white/80 backdrop-blur-md text-[11px] text-slate-600 p-3 rounded-lg border border-slate-200 space-y-1"></div>
        </div>
    </main>
</div>

<script id="lesson-data" type="application/json">__LESSON_DATA__</script>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('lesson-data').textContent);
const BOARD = DATA.board || {};
const UI = Object.assign({
    consoleTitle: "动态控制台", solutionTitle: "详细解析",
    collapse: "收起解析", expand: "展开解析"
}, (DATA.lesson && DATA.lesson.ui) || {});

// ===== 语义色板 =====
const COLORS = {
    curve:'#f59e0b', curve2:'#ec4899', curve3:'#06b6d4', curve4:'#8b5cf6',
    tangent:'#10b981', line:'#2dd4bf', aux:'#94a3b8',
    ptA:'#ef4444', ptB:'#3b82f6', point:'#1e293b', given:'#a78bfa',
    fixed:'#34d399', vecA:'#ef4444', vecB:'#3b82f6',
    vec:'#f59e0b', locus:'#06b6d4', area:'rgba(45,212,191,0.15)',
    bar:'rgba(99,102,241,0.6)', barStroke:'#6366f1',
    box:'#f59e0b', boxFill:'rgba(245,158,11,0.2)',
    scatter:'#6366f1', regression:'#ef4444'
};
const col = c => (c && COLORS[c]) ? COLORS[c] : (c || '#1e293b');
const EPS = 1e-9;
function fmt(x, d=2){
    if (x === null || x === undefined || !isFinite(x)) return '\u2014';
    let s = x.toFixed(d);
    if (s === '-' + (0).toFixed(d)) s = (0).toFixed(d);
    return s;
}

// ===== 表达式引擎 =====
const MATHENV = {sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,sin:Math.sin,cos:Math.cos,tan:Math.tan,
    asin:Math.asin,acos:Math.acos,atan:Math.atan,atan2:Math.atan2,exp:Math.exp,log:Math.log,
    pow:Math.pow,min:Math.min,max:Math.max,sign:Math.sign,floor:Math.floor,ceil:Math.ceil,hypot:Math.hypot,PI:Math.PI};
const _exprCache={};
function evalExpr(expr, env){
    if(typeof expr!=='string') return expr;
    const scope=Object.assign({}, MATHENV, env);
    const names=Object.keys(scope);
    const key=expr+'|'+names.join(',');
    let fn=_exprCache[key];
    if(!fn){ try{ fn=Function(...names,'"use strict";return ('+expr.replace(/\^/g,'**')+');'); }
             catch(e){ fn=()=>NaN; } _exprCache[key]=fn; }
    try{ const v=fn(...names.map(n=>scope[n])); return (typeof v==='number')?v:NaN; }catch(e){ return NaN; }
}
const resolveVal=(v,env,pval)=> (typeof v==='string')? (v==='@param'?pval:evalExpr(v,env)) : v;

// ===== 几何基元 =====
const lineFromSlope = (p, k) => ({p0:p.slice(), dir:[1, k]});
const lineThroughPoints = (a, b) => ({p0:a.slice(), dir:[b[0]-a[0], b[1]-a[1]]});
function lineABC(L){ const a=L.dir[1], b=-L.dir[0]; const c=-(a*L.p0[0]+b*L.p0[1]); return {a,b,c}; }
function clipLine(L, view){
    const cand=[]; const [dx,dy]=L.dir, [x0,y0]=L.p0;
    const push=t=>{const x=x0+t*dx,y=y0+t*dy;
        if(x>=view.xRange[0]-EPS&&x<=view.xRange[1]+EPS&&y>=view.yRange[0]-EPS&&y<=view.yRange[1]+EPS) cand.push([t,x,y]);};
    if(Math.abs(dx)>EPS){push((view.xRange[0]-x0)/dx);push((view.xRange[1]-x0)/dx);}
    if(Math.abs(dy)>EPS){push((view.yRange[0]-y0)/dy);push((view.yRange[1]-y0)/dy);}
    if(cand.length<2) return null;
    cand.sort((p,q)=>p[0]-q[0]);
    const A=cand[0], B=cand[cand.length-1];
    return [[A[1],A[2]],[B[1],B[2]]];
}
function intersectLineLine(L1,L2){
    const e1=lineABC(L1), e2=lineABC(L2);
    const det=e1.a*e2.b-e2.a*e1.b;
    if(Math.abs(det)<EPS) return null;
    return [(-e1.c*e2.b+e2.c*e1.b)/det, (-e1.a*e2.c+e2.a*e1.c)/det];
}
const midpoint=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
function footPerp(P,L){ const {a,b,c}=lineABC(L); const d=(a*P[0]+b*P[1]+c)/(a*a+b*b); return [P[0]-a*d, P[1]-b*d]; }
function reflectPt(P,L){ const f=footPerp(P,L); return [2*f[0]-P[0], 2*f[1]-P[1]]; }

// ===== 数据集工具 =====
function getDS(name) { return (BOARD.datasets||[]).find(d => d.name === name); }
function sortNum(a,b){return a-b;}
function statsOf(ds){
    if(!ds||!ds.values||!ds.values.length) return null;
    const v=ds.values.slice().sort(sortNum), n=v.length;
    const mean=v.reduce((s,x)=>s+x,0)/n;
    const stddev=Math.sqrt(v.reduce((s,x)=>s+(x-mean)*(x-mean),0)/n);
    const median=n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2;
    const q1=n%2?medianOf(v.slice(0,(n-1)/2)):medianOf(v.slice(0,n/2));
    const q3=n%2?medianOf(v.slice((n+1)/2)):medianOf(v.slice(n/2));
    return {v, n, min:v[0], max:v[n-1], mean, stddev, median, q1, q3, iqr:q3-q1};
}
function medianOf(arr){const n=arr.length; return n%2?arr[(n-1)/2]:(arr[n/2-1]+arr[n/2])/2;}

// ===== 正态分布 =====
function normPDF(x, mu, sigma){
    return 1/(sigma*Math.sqrt(2*Math.PI))*Math.exp(-(x-mu)*(x-mu)/(2*sigma*sigma));
}
function normCDF(x, mu, sigma){
    // Abramowitz & Stegun approximation
    const t=1/(1+0.2316419*Math.abs((x-mu)/sigma));
    const p=1-0.3989423*Math.exp(-(x-mu)*(x-mu)/(2*sigma*sigma))*(0.3193815*t-0.3565638*t*t+1.781478*t*t*t-1.821256*t*t*t*t+1.330274*t*t*t*t*t);
    return x>=mu?p:1-p;
}
function erf(x){ const t=1/(1+0.47047*Math.abs(x)); const p=1-t*(0.3480242+t*(-0.0958798+t*0.7478556))*Math.exp(-x*x); return x>=0?p:-p;}
function factorial(n){if(n<0)return NaN;if(n<2)return 1;let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function nCr(n,r){if(r<0||r>n)return 0;r=Math.min(r,n-r);let res=1;for(let i=1;i<=r;i++)res=res*(n-r+i)/i;return res;}
function nPr(n,r){if(r<0||r>n)return 0;let res=1;for(let i=0;i<r;i++)res*=n-i;return res;}

// ===== 函数采样 =====
function sampleFunction(fnDef, view, env, N){
    const steps = N || 400;
    const [xMin, xMax] = view.xRange;
    const dx = (xMax - xMin) / steps;
    const segments = [];
    let current = [];
    for (let i = 0; i <= steps; i++) {
        const x = xMin + i * dx;
        const y = evalExpr(fnDef.expr, Object.assign({}, env, { x }));
        if (isFinite(y)) {
            if (current.length > 0) {
                const prev = current[current.length - 1];
                if (Math.abs(y - prev[1]) > 10 * dx) {
                    if (current.length > 1) segments.push(current);
                    current = [];
                }
            }
            current.push([x, y]);
        } else {
            if (current.length > 1) segments.push(current);
            current = [];
        }
    }
    if (current.length > 1) segments.push(current);
    return segments;
}

// ===== 场景构建 =====
const PARAM_NAME = (BOARD.param && /^[A-Za-z_$][\w$]*$/.test(BOARD.param.name||'')) ? BOARD.param.name : null;

function normPoints(env){
    const reg={}; const src=BOARD.points||{};
    const xyOf = v => [resolveVal(v[0],env), resolveVal(v[1],env)];
    for(const name in src){ const v=src[name];
        if(Array.isArray(v)) reg[name]={xy:xyOf(v), color:'point', label:name, emphasis:false, hidden:false};
        else if(v && typeof v === 'object' && Array.isArray(v.xy)) reg[name]={xy:xyOf(v.xy), color:v.color||'point', label:(v.label!==undefined?v.label:name), emphasis:!!v.emphasis, hidden:!!v.hidden};
    }
    return reg;
}

function buildScene(pval){
    const env={ p: pval }; if(PARAM_NAME) env[PARAM_NAME]=pval;
    (BOARD.scalars||[]).forEach(s=>{ env[s.name]=evalExpr(s.expr, env); });
    const pts=normPoints(env);
    const lines={}, vectors={}, segments={}, polys=[];
    const P = n => (pts[n] ? pts[n].xy : null);
    const resolveNum = v => (v==='@param') ? pval : (typeof v==='string'? evalExpr(v, env) : v);
    const addPt = (n,xy,o={}) => { pts[n]=Object.assign({xy:xy?xy.slice():[NaN,NaN], color:'point', label:n, emphasis:false, hidden:false}, o); };
    const getFn = name => (BOARD.functions||[]).find(f => f.name === name);

    (BOARD.derived||[]).forEach(d=>{
        switch(d.type){
            // --- function-specific ---
            case 'point_on_function': {
                const fnDef = getFn(d.function);
                if (fnDef) {
                    const xVal = resolveNum(d.x);
                    if (isFinite(xVal)) {
                        const yVal = evalExpr(fnDef.expr, Object.assign({}, env, { x: xVal }));
                        if (isFinite(yVal)) addPt(d.name, [xVal, yVal], {color:d.color||'ptA', label:d.label||d.name, emphasis:true});
                    }
                }
                break;
            }
            case 'tangent_at_function': {
                const fnDef = getFn(d.function);
                const pt = pts[d.point];
                if (fnDef && pt && pt.xy && isFinite(pt.xy[0])) {
                    const x0 = pt.xy[0];
                    const tenv = Object.assign({}, env, { x: x0 });
                    const y0 = evalExpr(fnDef.expr, tenv);
                    const slope = evalExpr(d.derivative, tenv);
                    if (isFinite(y0) && isFinite(slope)) {
                        lines[d.name] = {L:lineFromSlope([x0, y0], slope), color:d.color||'tangent', label:d.label, dashed:d.dashed};
                    }
                }
                break;
            }
            case 'area_under_curve': {
                const fnDef = getFn(d.function);
                if (fnDef) {
                    const xMin = resolveVal(d.xRange[0], env, pval);
                    const xMax = resolveVal(d.xRange[1], env, pval);
                    const baseline = d.baseline !== undefined ? resolveVal(d.baseline, env, pval) : 0;
                    if (!isFinite(xMin) || !isFinite(xMax) || xMax <= xMin) break;
                    const N = 200, dx = (xMax - xMin) / N;
                    const fillPts = [];
                    for (let i = 0; i <= N; i++) {
                        const y = evalExpr(fnDef.expr, Object.assign({}, env, { x: xMin + i * dx }));
                        if (isFinite(y)) fillPts.push([xMin + i * dx, y]);
                    }
                    for (let i = N; i >= 0; i--) fillPts.push([xMin + i * dx, baseline]);
                    if (fillPts.length > 2) polys.push({ pts: fillPts, color: d.color || 'area' });
                }
                break;
            }
            case 'area_between_curves': {
                const fnDef1 = getFn(d.function);
                const fnDef2 = getFn(d.function2);
                if (fnDef1 && fnDef2) {
                    const xMin = resolveVal(d.xRange[0], env, pval);
                    const xMax = resolveVal(d.xRange[1], env, pval);
                    if (!isFinite(xMin) || !isFinite(xMax) || xMax <= xMin) break;
                    const N = 200, dx = (xMax - xMin) / N;
                    const fillPts = [];
                    for (let i = 0; i <= N; i++) {
                        const y = evalExpr(fnDef1.expr, Object.assign({}, env, { x: xMin + i * dx }));
                        if (isFinite(y)) fillPts.push([xMin + i * dx, y]);
                    }
                    for (let i = N; i >= 0; i--) {
                        const y = evalExpr(fnDef2.expr, Object.assign({}, env, { x: xMin + i * dx }));
                        if (isFinite(y)) fillPts.push([xMin + i * dx, y]);
                    }
                    if (fillPts.length > 2) polys.push({ pts: fillPts, color: d.color || 'area' });
                }
                break;
            }
            // --- retained geometry types ---
            case 'line_through_slope': lines[d.name]={L:lineFromSlope(P(d.point), resolveNum(d.slope)), color:d.color||'line', label:d.label, dashed:d.dashed}; break;
            case 'line_through_points': lines[d.name]={L:lineThroughPoints(P(d.a),P(d.b)), color:d.color||'line', label:d.label, dashed:d.dashed}; break;
            case 'intersect_line_line': addPt(d.name, intersectLineLine(lines[d.a].L, lines[d.b].L), {color:d.color||'point', label:d.label||d.name}); break;
            case 'midpoint': addPt(d.name, midpoint(P(d.a),P(d.b)), {color:d.color||'point', label:d.label||d.name, emphasis:d.emphasis}); break;
            case 'foot_perp': addPt(d.name, footPerp(P(d.point), lines[d.line].L), {color:d.color||'point', label:d.label||d.name}); break;
            case 'reflect': addPt(d.name, reflectPt(P(d.point), lines[d.line].L), {color:d.color||'point', label:d.label||d.name}); break;
            case 'point_reflect': { const ctr=d.center?(Array.isArray(d.center)?d.center:P(d.center)):[0,0]; const o=P(d.of); addPt(d.name,[2*ctr[0]-o[0],2*ctr[1]-o[1]],{color:d.color||'point',label:d.label||d.name,emphasis:d.emphasis}); break; }
            case 'vector': vectors[d.name]={from:P(d.from), to:P(d.to), color:d.color||'vec', label:d.label}; break;
            case 'segment': segments[d.name]={a:P(d.a), b:P(d.b), color:d.color||'aux', dashed:d.dashed, label:d.label}; break;
            case 'polygon': polys.push({pts:(d.pts||[]).map(P), color:d.color||'area', stroke:d.stroke}); break;
        }
    });
    return {pts, lines, vectors, segments, polys, env};
}

// ===== 读数 =====
function computeReadouts(scene, pval){
    const out=[];
    (BOARD.readouts||[]).forEach(r=>{
        let text='\u2014', scalar=null, dyncolor=null;
        const P=n=>scene.pts[n]?scene.pts[n].xy:null;
        const getFn = name => (BOARD.functions||[]).find(f => f.name === name);
        try{
            switch(r.type){
                case 'function_at': {
                    const fnDef = getFn(r.function);
                    if (fnDef) {
                        const xVal = resolveVal(r.x, scene.env, pval);
                        if (isFinite(xVal)) {
                            scalar = evalExpr(fnDef.expr, Object.assign({}, scene.env, { x: xVal }));
                            text = fmt(scalar, r.digits!=null?r.digits:2);
                        }
                    }
                    break;
                }
                case 'derivative_at': {
                    const xVal = resolveVal(r.x, scene.env, pval);
                    if (isFinite(xVal)) {
                        scalar = evalExpr(r.derivative, Object.assign({}, scene.env, { x: xVal }));
                        text = fmt(scalar, r.digits!=null?r.digits:2);
                    }
                    break;
                }
                case 'area_value': {
                    const fnDef = getFn(r.function);
                    if (fnDef) {
                        const xMin = resolveVal(r.xRange[0], scene.env, pval);
                        const xMax = resolveVal(r.xRange[1], scene.env, pval);
                        const baseline = r.baseline !== undefined ? resolveVal(r.baseline, scene.env, pval) : 0;
                        if (isFinite(xMin) && isFinite(xMax) && xMax > xMin) {
                            const N = 200, dx = (xMax - xMin) / N;
                            let area = 0;
                            for (let i = 0; i < N; i++) {
                                const y1 = evalExpr(fnDef.expr, Object.assign({}, scene.env, { x: xMin + i * dx })) - baseline;
                                const y2 = evalExpr(fnDef.expr, Object.assign({}, scene.env, { x: xMin + (i + 1) * dx })) - baseline;
                                if (isFinite(y1) && isFinite(y2)) area += (y1 + y2) / 2 * dx;
                            }
                            scalar = Math.abs(area);
                            text = fmt(scalar, r.digits!=null?r.digits:2);
                        }
                    }
                    break;
                }
                case 'coord':{ const p=P(r.of); text=p?`(${fmt(p[0])}, ${fmt(p[1])})`:'\u2014'; break; }
                case 'distance':{ const a=P(r.a),b=P(r.b); scalar=Math.hypot(a[0]-b[0],a[1]-b[1]); text=fmt(scalar,3); break; }
                case 'expr':{ scalar=evalExpr(r.expr, scene.env); text=fmt(scalar, r.digits!=null?r.digits:2); break; }
                // --- stats readout types ---
                case 'mean':{ const ds=getDS(r.dataset); if(ds){const st=statsOf(ds);scalar=st?st.mean:null;text=fmt(scalar,r.digits!=null?r.digits:2);} break; }
                case 'median':{ const ds=getDS(r.dataset); if(ds){const st=statsOf(ds);scalar=st?st.median:null;text=fmt(scalar,r.digits!=null?r.digits:2);} break; }
                case 'stddev':{ const ds=getDS(r.dataset); if(ds){const st=statsOf(ds);scalar=st?st.stddev:null;text=fmt(scalar,r.digits!=null?r.digits:2);} break; }
                case 'percentile': {
                    const ds=getDS(r.dataset);
                    if(ds&&r.p!==undefined){
                        const st=statsOf(ds); if(!st) break;
                        const idx=Math.floor(r.p/100*st.n);
                        scalar=st.v[Math.min(Math.max(idx,0),st.n-1)];
                        text=fmt(scalar,r.digits!=null?r.digits:2);
                    }
                    break;
                }
                case 'probability': {
                    const fnDef = getFn(r.function);
                    if(fnDef && r.xRange && r.xRange.length===2){
                        const xMin=resolveVal(r.xRange[0],scene.env,pval);
                        const xMax=resolveVal(r.xRange[1],scene.env,pval);
                        if(isFinite(xMin)&&isFinite(xMax)&&xMax>xMin){
                            const N=200,dx=(xMax-xMin)/N;
                            let area=0;
                            for(let i=0;i<N;i++){
                                const y1=evalExpr(fnDef.expr,Object.assign({},scene.env,{x:xMin+i*dx}));
                                const y2=evalExpr(fnDef.expr,Object.assign({},scene.env,{x:xMin+(i+1)*dx}));
                                if(isFinite(y1)&&isFinite(y2)) area+=(y1+y2)/2*dx;
                            }
                            scalar=Math.abs(area);
                            text=fmt(scalar,r.digits!=null?r.digits:4);
                        }
                    }
                    break;
                }
                case 'combinatorics': {
                    if(r.kind==='nCr'){scalar=nCr(resolveVal(r.n,scene.env,pval),resolveVal(r.r,scene.env,pval));text=fmt(scalar,0);}
                    else if(r.kind==='nPr'){scalar=nPr(resolveVal(r.n,scene.env,pval),resolveVal(r.r,scene.env,pval));text=fmt(scalar,0);}
                    else if(r.kind==='factorial'){scalar=factorial(resolveVal(r.n,scene.env,pval));text=fmt(scalar,0);}
                    break;
                }
            }
        }catch(e){ text='\u2014'; }
        out.push({id:r.id, label:r.label, text, scalar, highlight:!!r.highlight, color:r.color, dyncolor});
    });
    return out;
}

// ===== Canvas 渲染 =====
const canvas=document.getElementById('geometry-canvas');
const ctx=canvas.getContext('2d');
const view = BOARD.view || {xRange:[-6,6], yRange:[-4,4]};
let scale=100, offX=0, offY=0, cssW=0, cssH=0;
const SX = x => offX + x*scale;
const SY = y => offY - y*scale;

function resizeCanvas(){
    const rect=canvas.parentElement.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px'; canvas.style.height=rect.height+'px';
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
    cssW=rect.width; cssH=rect.height;
    const spanX=view.xRange[1]-view.xRange[0], spanY=view.yRange[1]-view.yRange[0];
    scale=Math.min((rect.width-40)/spanX, (rect.height-40)/spanY);
    offX=rect.width/2 - ((view.xRange[0]+view.xRange[1])/2)*scale;
    offY=rect.height/2 + ((view.yRange[0]+view.yRange[1])/2)*scale;
    update(); resizeDrawCanvas();
}

function drawPolyline(poly, breakOnLeave=false){
    let started=false;
    ctx.beginPath();
    for(const [x,y] of poly){
        const inView = x>=view.xRange[0]-2 && x<=view.xRange[1]+2 && y>=view.yRange[0]-2 && y<=view.yRange[1]+2;
        if(breakOnLeave && !inView){ started=false; continue; }
        if(!started){ ctx.moveTo(SX(x),SY(y)); started=true; } else ctx.lineTo(SX(x),SY(y));
    }
    ctx.stroke();
}

function drawArrow(from,to,color){
    const fx=SX(from[0]),fy=SY(from[1]),tx=SX(to[0]),ty=SY(to[1]);
    const ang=Math.atan2(ty-fy,tx-fx), hl=10;
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx,ty);
    ctx.lineTo(tx-hl*Math.cos(ang-Math.PI/6), ty-hl*Math.sin(ang-Math.PI/6));
    ctx.lineTo(tx-hl*Math.cos(ang+Math.PI/6), ty-hl*Math.sin(ang+Math.PI/6));
    ctx.fill();
}

function draw(scene){
    ctx.clearRect(0,0,cssW,cssH);

    // 网格
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=0.5;
    for(let x=Math.ceil(view.xRange[0]);x<=view.xRange[1];x++){ctx.beginPath();ctx.moveTo(SX(x),0);ctx.lineTo(SX(x),cssH);ctx.stroke();}
    for(let y=Math.ceil(view.yRange[0]);y<=view.yRange[1];y++){ctx.beginPath();ctx.moveTo(0,SY(y));ctx.lineTo(cssW,SY(y));ctx.stroke();}

    // 坐标轴
    ctx.strokeStyle='#94a3b8'; ctx.fillStyle='#94a3b8'; ctx.lineWidth=1.5;
    const x0=SX(0), y0=SY(0);
    if(x0>=0 && x0<=cssW){
        ctx.beginPath(); ctx.moveTo(10,y0); ctx.lineTo(cssW-12,y0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cssW-12,y0); ctx.lineTo(cssW-22,y0-5); ctx.lineTo(cssW-22,y0+5); ctx.fill();
    }
    if(y0>=0 && y0<=cssH){
        ctx.beginPath(); ctx.moveTo(x0,cssH-10); ctx.lineTo(x0,12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x0,12); ctx.lineTo(x0-5,22); ctx.lineTo(x0+5,22); ctx.fill();
    }
    ctx.font='italic 14px \"Times New Roman\"'; ctx.fillStyle='#94a3b8';
    if(x0>=0 && x0<=cssW) ctx.fillText('x',cssW-16,y0+16);
    if(y0>=0 && y0<=cssH) ctx.fillText('y',x0-16,18);
    if(x0>=0 && x0<=cssW && y0>=0 && y0<=cssH) ctx.fillText('O',x0-14,y0+16);

    // 面积着色（在函数曲线之前绘制）
    scene.polys.forEach(pg=>{ if(pg.pts.some(p=>!p||!isFinite(p[0])||!isFinite(p[1]))) return;
        ctx.beginPath(); pg.pts.forEach((p,i)=> i?ctx.lineTo(SX(p[0]),SY(p[1])):ctx.moveTo(SX(p[0]),SY(p[1]))); ctx.closePath();
        ctx.fillStyle=col(pg.color); ctx.fill();
        if(pg.stroke){ctx.strokeStyle=col(pg.stroke); ctx.lineWidth=1.5; ctx.stroke();}
    });

    // 函数曲线
    (BOARD.functions||[]).forEach(fn=>{
        const segs = sampleFunction(fn, view, scene.env, fn.samples||400);
        ctx.strokeStyle=col(fn.color||'curve'); ctx.lineWidth=fn.lineWidth||3;
        if(fn.dashed) ctx.setLineDash([7,5]);
        segs.forEach(seg => drawPolyline(seg, true));
        ctx.setLineDash([]);
    });

    // 统计图：直方图
    (BOARD.derived||[]).forEach(d=>{
        if(d.type!=='histogram') return;
        const ds=getDS(d.dataset); if(!ds) return;
        const st=statsOf(ds); if(!st) return;
        const bins=d.bins||10;
        const xMin=d.xRange?d.xRange[0]:st.min;
        const xMax=d.xRange?d.xRange[1]:st.max;
        const bw=(xMax-xMin)/bins;
        const counts=new Array(bins).fill(0);
        st.v.forEach(val=>{
            let idx=Math.floor((val-xMin)/bw);
            if(idx>=bins) idx=bins-1; if(idx<0) idx=0;
            counts[idx]++;
        });
        const maxCount=Math.max(...counts,1);
        const barScale=(view.yRange[1]-view.yRange[0])*0.8/maxCount;
        const barColor=d.color||'bar';
        const strokeColor=d.stroke||'barStroke';
        counts.forEach((c,i)=>{
            if(c===0) return;
            const left=xMin+i*bw;
            const right=left+bw;
            const h=c*barScale;
            ctx.fillStyle=col(barColor);
            ctx.fillRect(SX(left),SY(h),SX(right)-SX(left),SY(0)-SY(h));
            ctx.strokeStyle=col(strokeColor);
            ctx.lineWidth=1;
            ctx.strokeRect(SX(left),SY(h),SX(right)-SX(left),SY(0)-SY(h));
        });
    });

    // 统计图：箱线图
    (BOARD.derived||[]).forEach(d=>{
        if(d.type!=='box_plot') return;
        const ds=getDS(d.dataset); if(!ds) return;
        const st=statsOf(ds); if(!st) return;
        const xPos=d.at!==undefined?d.at:0;
        const w=(d.width||0.4)/2;
        const boxC=d.color||'box';
        ctx.strokeStyle=col(boxC);
        ctx.fillStyle=col(d.fill||'boxFill');
        ctx.lineWidth=2;
        // 箱体 Q1-Q3
        const yQ1=SY(st.q1), yQ3=SY(st.q3), yMed=SY(st.median);
        const xL=SX(xPos-w), xR=SX(xPos+w);
        ctx.fillRect(xL,yQ1,xR-xL,yQ3-yQ1);
        ctx.strokeRect(xL,yQ1,xR-xL,yQ3-yQ1);
        // 中位线
        ctx.beginPath(); ctx.moveTo(xL,yMed); ctx.lineTo(xR,yMed); ctx.stroke();
        // 须
        ctx.beginPath(); ctx.moveTo(SX(xPos),SY(st.min)); ctx.lineTo(SX(xPos),SY(st.q1)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(SX(xPos),SY(st.max)); ctx.lineTo(SX(xPos),SY(st.q3)); ctx.stroke();
        // 须端横线
        ctx.beginPath(); ctx.moveTo(xL,SY(st.min)); ctx.lineTo(xR,SY(st.min)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(xL,SY(st.max)); ctx.lineTo(xR,SY(st.max)); ctx.stroke();
    });

    // 统计图：散点图
    (BOARD.derived||[]).forEach(d=>{
        if(d.type!=='scatter') return;
        const dsX=getDS(d.datasetX); const dsY=getDS(d.datasetY);
        if(!dsX||!dsY) return;
        const n=Math.min(dsX.values.length, dsY.values.length);
        const ptColor=d.color||'scatter';
        ctx.fillStyle=col(ptColor);
        for(let i=0;i<n;i++){
            const x=dsX.values[i], y=dsY.values[i];
            if(!isFinite(x)||!isFinite(y)) continue;
            ctx.beginPath(); ctx.arc(SX(x),SY(y),4,0,2*Math.PI); ctx.fill();
        }
        // 回归线
        if(d.regression!==false){
            let sumX=0,sumY=0,sumXY=0,sumX2=0,count=0;
            for(let i=0;i<n;i++){
                const x=dsX.values[i], y=dsY.values[i];
                if(!isFinite(x)||!isFinite(y)) continue;
                sumX+=x; sumY+=y; sumXY+=x*y; sumX2+=x*x; count++;
            }
            if(count>1){
                const slope=(count*sumXY-sumX*sumY)/(count*sumX2-sumX*sumX);
                const intercept=(sumY-slope*sumX)/count;
                if(isFinite(slope)){
                    const regColor=d.regressionColor||'regression';
                    ctx.strokeStyle=col(regColor);
                    ctx.lineWidth=2; ctx.setLineDash([5,4]);
                    ctx.beginPath();
                    const x1=view.xRange[0], y1=slope*x1+intercept;
                    const x2=view.xRange[1], y2=slope*x2+intercept;
                    if(isFinite(y1)&&isFinite(y2)){
                        ctx.moveTo(SX(x1),SY(y1)); ctx.lineTo(SX(x2),SY(y2)); ctx.stroke();
                    }
                    ctx.setLineDash([]);
                }
            }
        }
    });

    // 轨迹（locus trace）
    if(BOARD.trace){ const tr=BOARD.trace; const p=BOARD.param; const path=[];
        const steps=160; for(let i=0;i<=steps;i++){const v=p.min+(p.max-p.min)*i/steps; const sc=buildScene(v); const pt=sc.pts[tr.of]; if(pt&&isFinite(pt.xy[0])) path.push(pt.xy);}
        ctx.strokeStyle=col(tr.color||'locus'); ctx.lineWidth=2; ctx.setLineDash([2,3]); drawPolyline(path,true); ctx.setLineDash([]);
    }

    // 线段
    for(const k in scene.segments){ const s=scene.segments[k]; if(!s.a||!s.b||!isFinite(s.a[0])||!isFinite(s.b[0])) continue;
        ctx.strokeStyle=col(s.color); ctx.lineWidth=2; if(s.dashed)ctx.setLineDash([6,5]);
        ctx.beginPath(); ctx.moveTo(SX(s.a[0]),SY(s.a[1])); ctx.lineTo(SX(s.b[0]),SY(s.b[1])); ctx.stroke(); ctx.setLineDash([]);
    }

    // 直线
    for(const k in scene.lines){ const ln=scene.lines[k]; const seg=clipLine(ln.L,view); if(!seg) continue;
        ctx.strokeStyle=col(ln.color); ctx.lineWidth=2; if(ln.dashed)ctx.setLineDash([6,5]);
        ctx.beginPath(); ctx.moveTo(SX(seg[0][0]),SY(seg[0][1])); ctx.lineTo(SX(seg[1][0]),SY(seg[1][1])); ctx.stroke(); ctx.setLineDash([]);
    }

    // 向量
    for(const k in scene.vectors){ const v=scene.vectors[k]; if(!v.from||!v.to||!isFinite(v.from[0])||!isFinite(v.to[0])) continue; drawArrow(v.from,v.to,col(v.color)); }

    // 点 + 标签
    for(const name in scene.pts){ const pt=scene.pts[name]; if(pt.hidden||!pt.xy||!isFinite(pt.xy[0])) continue;
        const r=pt.emphasis?6:4;
        ctx.fillStyle=col(pt.color); ctx.beginPath(); ctx.arc(SX(pt.xy[0]),SY(pt.xy[1]),r,0,2*Math.PI); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=pt.emphasis?2:1.5; ctx.stroke();
        if(pt.label){ ctx.fillStyle='#1e293b'; ctx.font='bold 12px sans-serif'; ctx.fillText(pt.label, SX(pt.xy[0])+8, SY(pt.xy[1])-7); }
    }
}

// ===== 控制台 DOM =====
function renderKatex(el){ if(typeof renderMathInElement!=='undefined') renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}); }

function buildConsole(){
    document.getElementById('prob-title').textContent = (DATA.lesson&&DATA.lesson.title)||'';
    document.getElementById('prob-body').innerHTML = (DATA.lesson&&DATA.lesson.problem)||'';
    document.getElementById('console-title').textContent = BOARD.consoleTitle || UI.consoleTitle;
    document.getElementById('sol-title-text').textContent = UI.solutionTitle;
    document.getElementById('sol-vlabel').textContent = UI.solutionTitle;

    const p=BOARD.param;
    if(p){
        document.getElementById('param-block').classList.remove('hidden');
        document.getElementById('param-label').innerHTML = (p.label||p.name)+' :';
        const s=document.getElementById('param-slider');
        s.min=p.min; s.max=p.max; s.step=p.step||0.5; s.value=(p.value!==undefined?p.value:p.min);
        document.getElementById('param-ticks').innerHTML = (p.ticks||[`${p.min}${p.unit||''}`, `${p.max}${p.unit||''}`]).map(t=>`<span>${t}</span>`).join('');
        s.addEventListener('input', update);
    }

    const roContainer=document.getElementById('readouts');
    roContainer.innerHTML = (BOARD.readouts||[]).map(r =>
        `<div class="flex justify-between items-center">`+
            `<span class="text-slate-500">${r.label||''}</span>`+
            `<span id="ro-${r.id}" class="font-semibold text-right ${r.highlight?'text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-md border border-emerald-100':''}" `+
            (r.color?`style="color:${r.color}"`:'')+`></span>`+
        `</div>`
    ).join('');

    if(BOARD.constant){
        document.getElementById('constant-block').classList.remove('hidden');
        document.getElementById('constant-val').innerHTML = '= '+BOARD.constant.label;
    }

    // 图例
    const lg = BOARD.legend || [];
    (BOARD.functions||[]).forEach(f => {
        if(f.label && !lg.some(l => l.text === f.label)) lg.push({color: f.color||'curve', text: f.label});
    });
    if(lg.length){
        document.getElementById('legend').innerHTML = lg.map(l =>
            `<div class="flex items-center gap-2"><span class="inline-block w-3 h-0.5 rounded-full" style="background:${col(l.color)}"></span><span>${l.text}</span></div>`
        ).join('');
    }

    // 步骤
    if(DATA.steps){
        document.getElementById('solution-body').innerHTML = DATA.steps.map((s,i) =>
            `<div class="step border border-slate-200 rounded-xl p-4 bg-white hover:shadow-sm transition-shadow">`+
                `<h4 class="font-bold text-slate-900 text-sm mb-2">步骤${i+1}：${s.title}</h4>`+
                `<div class="text-sm text-slate-600 leading-relaxed space-y-2">${s.content}</div>`+
            `</div>`
        ).join('');
    }
    renderKatex(document.getElementById('prob-body'));
    renderKatex(document.getElementById('solution-body'));
}

// ===== 主循环 =====
function update(){
    const p=BOARD.param; if(!p) return;
    const s=document.getElementById('param-slider');
    const cur=parseFloat(s.value);
    const dec=p.step<0.1?2:p.step<1?1:0;
    document.getElementById('param-val').textContent = fmt(cur,dec)+(p.unit||'');
    const scene=buildScene(cur);
    draw(scene);

    const ros=computeReadouts(scene, cur);
    ros.forEach(r=>{ const el=document.getElementById('ro-'+r.id); if(el) el.textContent=r.text; if(r.dyncolor) el.style.color=r.dyncolor; });

    // constant 验证
    if(BOARD.constant && ros.length){
        const cval = ros.find(r => r.id === BOARD.constant.of);
        if(cval){ const el=document.getElementById('constant-val'); el.innerHTML = '= '+cval.text + ' ' + (BOARD.constant.label||''); renderKatex(el); }
    }
}

function resetPlot(){
    const p=BOARD.param; if(!p) return;
    const s=document.getElementById('param-slider');
    s.value = (p.standard!==undefined?p.standard : (p.value!==undefined?p.value : p.min));
    update();
}

// ===== 涂鸦工具栏 =====
function resizeDrawCanvas(){
    const dc=document.getElementById('draw-canvas');
    const rect=canvas.parentElement.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    dc.width=rect.width*dpr; dc.height=rect.height*dpr;
    dc.style.width=rect.width+'px'; dc.style.height=rect.height+'px';
    const dctx=dc.getContext('2d');
    dctx.setTransform(1,0,0,1,0,0); dctx.scale(dpr,dpr);
    // redraw stored strokes (data stored in CSS pixel coords)
    const w=rect.width, h=rect.height;
    (window._drawStrokes||[]).forEach(st => {
        const sx=w/(st.w||w), sy=h/(st.h||h);
        if(st.eraser) dctx.globalCompositeOperation='destination-out';
        else { dctx.globalCompositeOperation='source-over'; dctx.strokeStyle=st.color; dctx.lineWidth=st.size; }
        dctx.lineCap='round'; dctx.lineJoin='round';
        if(st.pts.length<2) return;
        dctx.beginPath(); dctx.moveTo(st.pts[0].x*sx, st.pts[0].y*sy);
        for(let i=1;i<st.pts.length;i++) dctx.lineTo(st.pts[i].x*sx, st.pts[i].y*sy);
        dctx.stroke();
    });
    dctx.globalCompositeOperation='source-over';
}
let penMode=null, isDrawing=false, penColor='#1e293b', penSize=3, curStroke=null;
const strokes=[]; window._drawStrokes=strokes;
const dc=document.getElementById('draw-canvas');
const dctx=dc.getContext('2d');
function getPos(e){ const r=dc.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
dc.addEventListener('pointerdown',e=>{
    if(!penMode) return; isDrawing=true; const p=getPos(e);
    curStroke={color:penColor,size:penSize,eraser:penMode==='eraser',pts:[p],w:dc.getBoundingClientRect().width,h:dc.getBoundingClientRect().height};
    dc.setPointerCapture(e.pointerId);
});
dc.addEventListener('pointermove',e=>{
    if(!isDrawing||!curStroke) return; const p=getPos(e); curStroke.pts.push(p);
    if(penMode==='eraser') dctx.globalCompositeOperation='destination-out';
    else dctx.globalCompositeOperation='source-over';
    dctx.strokeStyle=penColor; dctx.lineWidth=penSize;
    dctx.lineCap='round'; dctx.lineJoin='round';
    const pts=curStroke.pts, lp=pts[pts.length-2];
    if(lp){ dctx.beginPath(); dctx.moveTo(lp.x,lp.y); dctx.lineTo(p.x,p.y); dctx.stroke(); }
    dctx.globalCompositeOperation='source-over';
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>dc.addEventListener(ev,()=>{
    if(isDrawing&&curStroke){ strokes.push(curStroke); curStroke=null; } isDrawing=false;
}));
document.getElementById('pen-btn').addEventListener('click',()=>{ penMode=penMode==='pen'?null:'pen'; updateToolbarUI(); });
document.getElementById('eraser-btn').addEventListener('click',()=>{ penMode=penMode==='eraser'?null:'eraser'; updateToolbarUI(); });
document.querySelectorAll('.draw-swatch').forEach(b=>b.addEventListener('click',()=>{ penColor=b.dataset.color; if(penMode==='eraser') penMode='pen'; updateToolbarUI(); }));
document.getElementById('pen-size').addEventListener('input',()=>{ penSize=parseFloat(document.getElementById('pen-size').value); });
document.getElementById('undo-btn').addEventListener('click',()=>{ if(strokes.length){ strokes.pop(); resizeDrawCanvas(); } });
document.getElementById('clear-draw-btn').addEventListener('click',()=>{ strokes.length=0; dctx.clearRect(0,0,dc.width,dc.height); });
function updateToolbarUI(){
    [document.getElementById('pen-btn'),document.getElementById('eraser-btn')].forEach(b=>b.classList.remove('bg-slate-700','text-white'));
    if(penMode==='pen') document.getElementById('pen-btn').classList.add('bg-slate-700','text-white');
    else if(penMode==='eraser') document.getElementById('eraser-btn').classList.add('bg-slate-700','text-white');
    dc.style.pointerEvents=penMode?'auto':'none';
    dc.style.touchAction=penMode?'none':'auto';
}

// ===== 解析面板折叠 =====
document.getElementById('toggle-solution').addEventListener('click',()=>{
    const panel=document.getElementById('solution-panel');
    const body=document.getElementById('solution-body');
    const header=document.getElementById('sol-header');
    const chevron=document.getElementById('sol-chevron');
    const vlabel=document.getElementById('sol-vlabel');
    const isOpen=!panel.classList.contains('closed');
    if(isOpen){
        panel.classList.add('closed'); panel.classList.add('lg:w-14');
        body.style.display='none'; header.style.display='none';
        vlabel.classList.remove('hidden');
        chevron.style.transform='rotate(180deg)';
    } else {
        panel.classList.remove('closed'); panel.classList.remove('lg:w-14');
        body.style.display=''; header.style.display='';
        vlabel.classList.add('hidden');
        chevron.style.transform='';
        setTimeout(resizeCanvas,350);
    }
});

// ===== 初始化 =====
window.onload=function(){
    buildConsole();
    resizeCanvas();
    update();
    window.addEventListener('resize', resizeCanvas);
};
