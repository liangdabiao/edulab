<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
    <title>交互教学课程导航</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0a1628;color:#e8eef8;min-height:100vh}
header{background:linear-gradient(135deg,#0f1f3a,#162a4e);border-bottom:1px solid #243a5e;padding:40px 24px 32px;text-align:center}
header h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,#06b6d4,#6366f1,#d946ef);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:#9ab0d0;margin-top:8px;font-size:14px}
.stats{display:flex;justify-content:center;gap:24px;margin-top:16px;flex-wrap:wrap}
.stat{text-align:center}
.stat .num{font-size:24px;font-weight:700;color:#06b6d4}
.stat .label{font-size:12px;color:#9ab0d0}
.container{max-width:1200px;margin:0 auto;padding:24px 16px 60px}
.section{margin-bottom:40px}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #243a5e}
.section-title .badge{font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:#11203a;border:1px solid #243a5e;border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px}
.card:hover{transform:translateY(-2px);border-color:#6366f1;box-shadow:0 4px 20px rgba(99,102,241,.15)}
.card .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;width:fit-content}
.card .name{font-size:14px;font-weight:600;line-height:1.4}
.card .desc{font-size:12px;color:#9ab0d0;line-height:1.5}
.card .meta{font-size:11px;color:#64748b;display:flex;gap:8px;margin-top:auto}
/* accent colors */
.chem .tag,.badge.chem{background:rgba(99,102,241,.3);color:#a5b4fc}
.it .tag,.badge.it{background:rgba(6,182,212,.3);color:#67e8f9}
.bio .tag,.badge.bio{background:rgba(52,211,153,.3);color:#6ee7b7}
.geo .tag,.badge.geo{background:rgba(251,191,36,.3);color:#fcd34d}
.math .tag,.badge.math{background:rgba(248,113,113,.3);color:#fca5a5}
.physics .tag,.badge.physics{background:rgba(232,121,249,.3);color:#f0abfc}
.solid-geo .tag,.badge.solid-geo{background:rgba(14,165,233,.3);color:#7dd3fc}
.chem{border-left:3px solid #6366f1}
.it{border-left:3px solid #06b6d4}
.bio{border-left:3px solid #34d399}
.geo{border-left:3px solid #fbbf24}
.math{border-left:3px solid #f87171}
.physics{border-left:3px solid #e879f9}
.solid-geo{border-left:3px solid #0ea5e9}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding-left:12px;margin-top:8px}
.sub-label{font-size:12px;color:#9ab0d0;font-weight:600;padding:4px 0 2px 12px}
@media(max-width:600px){header{padding:24px 16px}header h1{font-size:22px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header style="position:relative">

    GitHub
  </a>
  <h1>交互教学课程导航</h1>
  <p>步进式知识点讲解 · Canvas 2D 动画场景 · 侧栏面板 · 步进器控制</p>
  <div class="stats">
    <div class="stat"><div class="num" id="totalCount">0</div><div class="label">课程总数</div></div>
    <div class="stat"><div class="num">6</div><div class="label">学科分类</div></div>
  </div>
</header>

<div class="container" id="app">

  <!-- ===== 化学 ===== -->
  <div class="section">

      🧪 化学

    </div>
    <div class="sub-label">⚡ 微观看反应</div>

    <div class="sub-grid" id="chem-tutorial"></div>
  </div>

  <!-- ===== 信息技术 ===== -->
  <div class="section">
    <div class="section-title">
      💻 信息技术
      <span class="badge it">算法 · 编程 · 数据 · 网络 · AI</span>
    </div>
    <div class="grid" id="it"></div>
  </div>

  <!-- ===== 生物 ===== -->
  <div class="section">
    <div class="section-title">
      🧬 生物

    <div class="grid" id="bio"></div>
  </div>

  <!-- ===== 地理 ===== -->

    <div class="section-title">
      🌍 地理

    </div>
    <div class="grid" id="geo"></div>
  </div>

  <!-- ===== 数学 ===== -->
  <div class="section">
    <div class="section-title">
      📐 数学
      <span class="badge math">函数 · 向量 · 统计 · 逻辑 · 几何</span>
    </div>
    <div class="grid" id="math"></div>
  </div>

  <!-- ===== 物理 ===== -->
  <div class="section">
    <div class="section-title">
      ⚛ 物理
      <span class="badge physics">力学 · 电磁学</span>
    </div>

  <!-- ===== 立体几何 ===== -->

    <div class="section-title">
      🏛 立体几何

    </div>
    <div class="grid" id="solid-geo"></div>
  </div>

</div>

const containers = {
  "chem-reaction": "chem-reaction",
  "chem-tutorial": "chem-tutorial",
  "it": "it",
  "bio": "bio",
  "geo": "geo",
  "math": "math",
  "physics": "physics",
  "solid-geo": "solid-geo",
};

document.getElementById("totalCount").textContent = DATA.length;

for (const item of DATA) {
  const el = document.getElementById(containers[item.cat]);
  if (!el) continue;
  const card = document.createElement("a");
  card.className = `card ${item.cat === "chem-reaction" || item.cat === "chem-tutorial" ? "chem" : item.cat}`;
  card.href = item.file;
  card.innerHTML = `
    <div class="tag">${item.tag}</div>
    <div class="name">${item.title}</div>
    <div class="desc">${item.desc}</div>
    <div class="meta">${item.file}</div>
  `;
  el.appendChild(card);
