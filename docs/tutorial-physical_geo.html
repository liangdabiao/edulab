<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">IT 交互课程</title>
<style>
:root{--bg:#0a1628;--panel:#11203a;--card:#172a4a;--ink:#e8eef8;--muted:#9ab0d0;--accent:#6366f1;--accent2:#06b6d4;--line:#243a5e;--good:#34d399;--warn:#fbbf24;--bad:#f87171;}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .title{font-size:15px;font-weight:600}.topbar .subtitle{font-size:12px;color:var(--muted)}
.cards{display:flex;gap:10px;padding:10px 16px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(99,102,241,.06),transparent)}
.card{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.card.s2::before{background:var(--accent2)}.card.s3::before{background:var(--good)}.card.s4::before{background:var(--warn)}
.card h4{margin:0 0 4px;font-size:13px}.card .v{font-size:11px;color:var(--muted);line-height:1.5}
.card .num{position:absolute;right:8px;top:6px;font-size:24px;font-weight:700;color:rgba(255,255,255,.07)}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;min-width:0;position:relative}
canvas{background:#0f172a;border:1px solid var(--line);border-radius:12px;max-width:100%;max-height:100%;display:block}
#codeOverlay{position:absolute;top:10px;right:14px;background:rgba(15,23,42,0.92);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:'Consolas','Monaco','Courier New',monospace;font-size:12px;line-height:1.6;max-width:340px;display:none;overflow:auto;max-height:calc(100% - 40px)}
#codeOverlay .line{color:#94a3b8;white-space:pre}.codeOverlay .highlight{background:rgba(251,191,36,0.2);border-left:3px solid var(--warn);padding-left:6px;display:block}
.code-keyword{color:#c084fc}.code-builtin{color:#67e8f9}.code-string{color:#34d399}.code-number{color:#fbbf24}.code-comment{color:#64748b;font-style:italic}.code-op{color:#f87171}
.panel{width:340px;flex:none;padding:14px;overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);font-size:13px;line-height:1.7}
.panel h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--accent);color:#1a1a1a;font-size:11px;font-weight:600}
.body{color:var(--muted);margin:0 0 10px}.body strong{color:var(--ink)}
.body code{background:rgba(99,102,241,.2);color:#c7d2fe;padding:1px 5px;border-radius:4px;font-family:Consolas,Monaco,monospace;font-size:12px}
.points{background:rgba(255,255,255,.04);border-radius:8px;padding:10px;margin-top:8px;border-left:3px solid var(--accent2)}
.points h4{margin:0 0 6px;font-size:13px}.points ul{margin:0;padding-left:18px;color:var(--muted)}
.points li{margin-bottom:3px}.points li strong{color:var(--accent2)}
#paramArea{background:rgba(255,255,255,.04);border-radius:8px;padding:10px;margin-top:8px;display:none}
#paramArea label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
#paramArea input[type=range]{width:100%;accent-color:var(--accent2);height:6px;border-radius:3px;background:var(--line);outline:none;cursor:pointer}
#paramArea .readout{font-size:12px;color:var(--ink);font-weight:600;text-align:right;margin-top:2px}
#paramArea .stat-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;padding:2px 0;border-top:1px solid rgba(255,255,255,.05)}
.stepbar{display:flex;gap:6px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.step{flex:1;min-width:90px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:11px;text-align:center;transition:all .15s}
.step:hover{background:#1e345a;border-color:var(--accent2)}
.step.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1a1a;font-weight:600;border-color:transparent}
.controls{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
button:hover{background:#1e345a}button.primary{background:var(--accent2);border-color:var(--accent2);color:#1a1a1a;font-weight:600}
.controls label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent2);cursor:pointer;border:2px solid var(--ink)}
.status{font-size:12px;color:var(--muted);margin-left:auto}
@media(max-width:960px){main{flex-direction:column}.panel{width:auto;border-left:none;border-top:1px solid var(--line);max-height:200px}.cards .card{min-width:100px}}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="cards" id="cards"></div>
<main>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div id="codeOverlay"></div>
  </div>
  <aside class="panel">
    <h2><span class="badge" id="stepBadge">概念</span><span id="stepTitle">步骤标题</span></h2>
    <p class="body" id="stepBody"></p>
    <div class="points" id="stepPoints"></div>
    <div id="paramArea">
      <label id="paramLabel">参数</label>
      <input type="range" id="paramSlider" min="0" max="1" step="0.01" value="0">
      <div class="readout" id="paramReadout">0</div>
      <div id="paramStats"></div>
    </div>
  </aside>
</main>
<div class="stepbar" id="stepbar"></div>
<div class="controls">
  <button id="playBtn" class="primary">▶ 播放</button><button id="resetBtn">↺ 重置</button>
  <button id="stepBackBtn">◀ 上一步</button><button id="stepFwdBtn">下一步 ▶</button>
  <label>速度 <input id="speedInp" type="range" min="0.3" max="3" step="0.1" value="1"></label>
  <span id="status" class="status">点击播放或选择步骤</span>
</div>

<script>
// ===================================================================
// 0) Data
// ===================================================================
const _DATA = {"meta": {"title": "自然地理基础", "subtitle": "地球运动 · 大气环流 · 水循环 · 板块构造", "module": "physical", "accent": "cyan"}, "cards": [{"num": 1, "title": "地球运动", "body": "自转·昼夜交替<br>公转·四季变化"}, {"num": 2, "title": "大气环流", "body": "三圈环流<br>气压带风带"}, {"num": 3, "title": "水循环", "body": "蒸发·降水<br>径流·下渗"}, {"num": 4, "title": "板块构造", "body": "板块运动<br>地震·火山"}], "steps": [{"tag": "概念", "name": "地球运动", "body": "<p><strong>地球运动</strong>包括自转和公转两种基本形式：<br>• <strong>自转</strong>：绕地轴自西向东旋转，周期约24小时，产生昼夜交替<br>• <strong>公转</strong>：绕太阳运行，周期约365.25天，产生四季变化<br>• 地轴与轨道面成66.5°夹角，是四季形成的根本原因</p>", "points": {"title": "地球运动", "items": ["自转方向：自西向东", "自转周期：23时56分4秒（恒星日）", "公转轨道：椭圆", "公转周期：365.25天", "四季：春分→夏至→秋分→冬至"]}, "scene": "globe_3d", "sceneArgs": {"mode": "rotation", "title": "地球自转与昼夜交替"}}, {"tag": "概念", "name": "地球公转与四季", "body": "<p><strong>地球公转</strong>导致太阳直射点的回归运动，形成四季。太阳直射点在南北回归线之间往返运动：<br>• 春分（3.21）→ 夏至（6.22）→ 秋分（9.23）→ 冬至（12.22）→ 春分<br>• 北半球夏季时，太阳直射北回归线</p>", "points": {"title": "四季形成", "items": ["太阳直射点回归运动", "南北回归线：23.5°", "昼夜长短随季节变化", "五带划分：热带/温带/寒带"]}, "scene": "globe_3d", "sceneArgs": {"mode": "revolution", "title": "地球公转与四季变化"}}, {"tag": "结构", "name": "大气环流", "body": "<p><strong>全球大气环流</strong>（三圈环流）是地球上的大气运动基本模式：<br>• <strong>赤道低压带</strong>：空气受热上升，降水丰富<br>• <strong>副热带高压带</strong>（30°）：空气下沉，干燥少雨<br>• <strong>副极地低压带</strong>（60°）：气流辐合上升<br>• <strong>极地高压带</strong>（90°）：冷空气下沉</p>", "points": {"title": "气压带风带", "items": ["赤道低压带：高温多雨", "副热带高压带：炎热干燥", "副极地低压带：温和多雨", "极地高压带：寒冷干燥"]}, "scene": "atmosphere", "sceneArgs": {"type": "global", "title": "全球三圈环流与气压带"}}, {"tag": "概念", "name": "风带", "body": "<p>由于气压差，大气从高压流向低压，受<strong>地转偏向力</strong>影响形成盛行风带：<br>• <strong>信风带</strong>（0°-30°）：东北/东南信风<br>• <strong>西风带</strong>（30°-60°）：盛行西风<br>• <strong>极地东风</strong>（60°-90°）：极地东风</p>", "points": {"title": "风带特征", "items": ["信风：低纬度稳定风向", "西风带：中纬度，多气旋", "极地东风：寒冷干燥", "地转偏向力影响风向"]}, "scene": "atmosphere", "sceneArgs": {"type": "wind", "title": "全球风带分布"}}, {"tag": "概念", "name": "季风环流", "body": "<p><strong>季风</strong>是由于海陆热力性质差异导致的季节性风向变化。<br>• <strong>夏季</strong>：大陆受热快形成低压，风从海洋吹向陆地（温暖湿润）<br>• <strong>冬季</strong>：大陆冷却快形成高压，风从陆地吹向海洋（寒冷干燥）<br>东亚季风是全球最典型的季风区。</p>", "points": {"title": "季风成因", "items": ["海陆热力差异是主因", "夏季风：海→陆，暖湿", "冬季风：陆→海，冷干", "东亚季风最典型"]}, "scene": "atmosphere", "sceneArgs": {"type": "seasonal", "season": "summer", "title": "夏季季风"}}, {"tag": "过程", "name": "水循环", "body": "<p><strong>水循环</strong>是指水在不同圈层之间连续运动的过程，包括：<br>• <strong>蒸发</strong>：海洋/陆地水→水汽<br>• <strong>水汽输送</strong>：风将水汽带到陆地上空<br>• <strong>降水</strong>：水汽凝结降落<br>• <strong>径流</strong>：地表/地下水流回海洋<br>水循环维持了全球水量的动态平衡。</p>", "points": {"title": "水循环环节", "items": ["蒸发（蒸腾）", "水汽输送", "降水", "地表径流", "下渗与地下径流"]}, "scene": "water_cycle", "sceneArgs": {"title": "水循环示意图"}}, {"tag": "过程", "name": "板块构造", "body": "<p><strong>板块构造学说</strong>认为岩石圈被分为六大板块，板块在软流层上运动。<br>• <strong>汇聚边界</strong>：板块碰撞→山脉/海沟/俯冲带<br>• <strong>张裂边界</strong>：板块分离→大洋中脊/裂谷<br>• <strong>转换边界</strong>：板块水平错动→地震<br>板块运动是地震和火山的主要成因。</p>", "points": {"title": "板块边界类型", "items": ["汇聚：板块碰撞挤压", "张裂：板块分离", "转换：水平错动", "板块内部相对稳定"]}, "scene": "plate_tectonics", "sceneArgs": {"type": "convergent", "title": "板块汇聚边界"}}, {"tag": "过程", "name": "板块类型与地震", "body": "<p>三种板块边界各具特征：<br>• <strong>张裂边界</strong>：如大西洋中脊，岩浆上涌形成新洋壳<br>• <strong>转换边界</strong>：如圣安德烈斯断层，地震频发<br>地震波分为纵波（P波）和横波（S波），P波速度快于S波。</p>", "points": {"title": "板块与地震", "items": ["张裂：大洋中脊/东非大裂谷", "转换：地震多发", "板块交界=地震带", "环太平洋地震带最活跃"]}, "scene": "plate_tectonics", "sceneArgs": {"type": "divergent", "title": "板块张裂边界"}}, {"tag": "总结", "name": "要点回顾", "body": "<p>本课学习了自然地理四大核心内容：地球运动、大气环流、水循环和板块构造。这些是理解自然环境的基础。</p>", "points": {"title": "本课要点", "items": ["地球自转产生昼夜，公转产生四季", "三圈环流形成全球气压带风带", "水循环维持水资源动态平衡", "板块运动塑造地表形态"]}, "scene": "concept_cards", "sceneArgs": {"title": "本课总结", "items": [{"icon": "🌍", "label": "地球运动", "desc": "自转·昼夜\n公转·四季", "color": "#06b6d4"}, {"icon": "🌪️", "label": "大气环流", "desc": "三圈环流\n气压带风带", "color": "#6366f1"}, {"icon": "💧", "label": "水循环", "desc": "蒸发·降水\n径流·下渗", "color": "#34d399"}, {"icon": "🏔️", "label": "板块构造", "desc": "汇聚·张裂\n转换边界", "color": "#fb923c"}]}}]};
const ACCENT = _DATA.meta?.accent || 'indigo';
const ACCENT_MAP = {
  amber:'#f59e0b',violet:'#a78bfa',emerald:'#34d399',cyan:'#06b6d4',
  indigo:'#6366f1',sky:'#0ea5e9',red:'#ef4444',green:'#22c55e',
  orange:'#f97316',slate:'#64748b',pink:'#ec4899'
};
document.documentElement.style.setProperty('--accent', ACCENT_MAP[ACCENT] || '#6366f1');
document.documentElement.style.setProperty('--accent2', ACCENT_MAP[ACCENT]==='#06b6d4'?'#6366f1':'#06b6d4');
document.getElementById('pageTitle').textContent = _DATA.meta.title + ' · 交互课程';
document.getElementById('topbar').innerHTML = '<span class="title">'+_DATA.meta.title+'</span><span class="subtitle">'+_DATA.meta.subtitle+'</span>';

// Cards
const cardsEl = document.getElementById('cards');
if(_DATA.cards && _DATA.cards.length){
  _DATA.cards.forEach(function(c,i){
    const d=document.createElement('div');d.className='card'+(i>0?' s'+(i+1):'');
    d.innerHTML='<div class="num">'+c.num+'</div><h4>'+c.title+'</h4><div class="v">'+c.body+'</div>';
    cardsEl.appendChild(d);
  });
}else cardsEl.style.display='none';

// Canvas & refs
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const statusEl=document.getElementById('status'),speedInp=document.getElementById('speedInp');
const stepBadge=document.getElementById('stepBadge'),stepTitle=document.getElementById('stepTitle');
const stepBody=document.getElementById('stepBody'),stepPoints=document.getElementById('stepPoints');
const codeOverlay=document.getElementById('codeOverlay');
const paramArea=document.getElementById('paramArea'),paramSlider=document.getElementById('paramSlider');
const paramLabel=document.getElementById('paramLabel'),paramReadout=document.getElementById('paramReadout');
const paramStats=document.getElementById('paramStats');

function fit(){
  const r=cv.parentElement.getBoundingClientRect();
  cv.width=Math.max(460,Math.min(1000,r.width-12));
  cv.height=Math.max(380,Math.min(600,r.height-12));
}
window.addEventListener('resize',function(){fit();draw();});fit();

// ===================================================================
// Helpers
// ===================================================================
function drawText(t,x,y,c,fs,a,b){
  ctx.fillStyle=c||'#9ab0d0';ctx.font=(fs||12)+'px sans-serif';
  ctx.textAlign=a||'center';ctx.textBaseline=b||'middle';ctx.fillText(t,x,y);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function glow(c,b,fn){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=b||10;fn();ctx.restore();}

// ===================================================================
// 1) Code overlay
// ===================================================================
function showCode(lines,hl){
  const el=codeOverlay;
  if(!lines||!lines.length){el.style.display='none';return;}
  el.style.display='block';
  el.innerHTML=lines.map(function(l,i){
    const cls=(i+1)===hl?' class="highlight"':'';
    return '<span'+cls+'><span class="line">'+escHtml(l)+'</span></span>';
  }).join('');
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hideCode(){codeOverlay.style.display='none';}

// ===================================================================
// 2) Scene drawers
// ===================================================================
const SCENES = {};

// --- array_bars: 静态柱状数组 ---
SCENES.array_bars = function(t,args){
  const W=cv.width,H=cv.height;
  const data=args.data||[];
  const title=args.title||'数组';
  drawText(title,W/2,25,'#fff',15);
  if(!data.length)return;
  const n=data.length,max=Math.max(...data);
  const gap=Math.min(8,W*0.02);
  const barW=Math.min(50,(W-60-gap*(n-1))/n);
  const baseY=H-50;
  data.forEach(function(v,i){
    const bh=(v/max)*(H-90);
    const x=30+i*(barW+gap);
    const y=baseY-bh;
    ctx.fillStyle=args.colors&&args.colors[i]?args.colors[i]:'#6366f1';
    ctx.fillRect(x,y,barW,bh);
    drawText(v+'',x+barW/2,y-8,'#e8eef8',11);
    drawText(i+'',x+barW/2,baseY+15,'#64748b',10);
  });
  drawText('索引',W/2,baseY+30,'#64748b',10);
};

// --- sort_bars: 排序动画核心 ---
SCENES.sort_bars = function(t,args){
  const W=cv.width,H=cv.height;
  const data=args.data||[];
  const progress=args.progress||0;
  const p=Math.min(1,Math.max(0,progress));
  drawText(args.title||'排序过程',W/2,25,'#fff',15);
  if(!data.length)return;

  // 计算快照
  const n=data.length;
  const totalSteps=n*(n-1)/2;
  const stepIdx2=Math.floor(p*totalSteps);
  const arr=[...data];
  // 模拟排序，记录每一步的交换状态
  let compI=-1,compJ=-1,swapI=-1,swapJ=-1,sortedUpTo=n;
  let stepCount=0;
  for(let i=0;i<n-1;i++){
    for(let j=0;j<n-1-i;j++){
      if(stepCount===stepIdx2){
        compI=j;compJ=j+1;
        if(arr[j]>arr[j+1]){[arr[j],arr[j+1]]=[arr[j+1],arr[j]];swapI=j;swapJ=j+1;}
      }
      if(arr[j]>arr[j+1]){[arr[j],arr[j+1]]=[arr[j+1],arr[j]];}
      stepCount++;
      if(stepCount>stepIdx2)break;
    }
    if(stepCount>stepIdx2){sortedUpTo=i;break;}
    sortedUpTo=i+1;
  }
  // 如果是完整排序后的状态
  if(stepIdx2>=totalSteps){arr.sort((a,b)=>a-b);sortedUpTo=n;compI=-1;compJ=-1;}

  const max=Math.max(...data);
  const gap=Math.min(8,W*0.02);
  const barW=Math.min(50,(W-60-gap*(n-1))/n);
  const baseY=H-50;
  arr.forEach(function(v,i){
    const bh=(v/max)*(H-90);
    const x=30+i*(barW+gap);
    const y=baseY-bh;
    // 颜色
    let col;
    if(i===compI||i===compJ)col='#fbbf24';       // 比较中（黄）
    else if(i===swapI||i===swapJ)col='#f87171';   // 交换中（红）
    else if(i>=n-sortedUpTo)col='#34d399';         // 已排序（绿）
    else col='#6366f1';                            // 未排序（紫）
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=col==='#6366f1'?0:6;
    roundRect(x,y,barW,bh,4);ctx.fill();ctx.shadowBlur=0;
    drawText(v+'',x+barW/2,y-6,'#e8eef8',10);
    drawText(i+'',x+barW/2,baseY+15,'#64748b',9);
  });
  // 状态说明
  const statusLine=stepIdx2>=totalSteps?'✓ 排序完成！':(swapI>=0?'↔ 交换 '+data[swapI]+' 和 '+data[swapJ]:(compI>=0?'⇄ 比较 '+arr[compI]+' 和 '+arr[compJ]:'准备'));
  drawText(statusLine,W/2,H-12,stepIdx2>=totalSteps?'#34d399':'#fbbf24',12);
};

// --- search_visual: 查找动画 ---
SCENES.search_visual = function(t,args){
  const W=cv.width,H=cv.height;
  const data=args.data||[];
  const target=args.target!==undefined?args.target:null;
  const p=Math.min(1,Math.max(0,args.progress||0));
  const type=args.type||'linear';
  drawText((type==='binary'?'二分':'线性')+'查找 · 目标: '+target,W/2,25,'#fff',15);
  if(!data.length)return;

  const n=data.length;
  const sorted=[...data].sort((a,b)=>a-b);
  const gap=Math.min(8,W*0.02);
  const barW=Math.min(50,(W-60-gap*(n-1))/n);
  const baseY=H-50;
  let foundIdx=-1,checked=[],lo=0,hi=n-1,mid=-1;

  if(type==='binary'){
    const steps=Math.ceil(Math.log2(n))||1;
    const stepIdx2=Math.min(Math.floor(p*steps),steps-1);
    let cl=0,cr=n-1;
    for(let s=0;s<steps;s++){
      const cm=Math.floor((cl+cr)/2);
      if(s<stepIdx2){
        checked.push(cm);
        if(sorted[cm]===target){foundIdx=cm;break;}
        if(sorted[cm]<target)cl=cm+1;else cr=cm-1;
      }else{
        lo=cl;hi=cr;mid=cm;
        // 标记所有未检查的为未检查状态
        break;
      }
    }
  }else{
    const steps=n;
    const stepIdx2=Math.min(Math.floor(p*steps),steps-1);
    for(let i=0;i<=stepIdx2;i++){
      checked.push(i);
      if(sorted[i]===target){foundIdx=i;break;}
    }
  }

  sorted.forEach(function(v,i){
    const bh=(v/Math.max(...data))*(H-90);
    const x=30+i*(barW+gap);
    const y=baseY-bh;
    let col;
    if(i===foundIdx)col='#34d399';
    else if(i===mid&&type==='binary')col='#fbbf24';
    else if(checked.includes(i))col='#f87171';
    else if(type==='binary'&&(i<lo||i>hi))col='#1e293b';
    else col='#6366f1';
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=col==='#6366f1'||col==='#1e293b'?0:6;
    roundRect(x,y,barW,bh,4);ctx.fill();ctx.shadowBlur=0;
    drawText(v+'',x+barW/2,y-6,'#e8eef8',10);
    drawText(i+'',x+barW/2,baseY+15,'#64748b',9);
  });
  const found=foundIdx>=0;
  drawText(found?'✓ 找到 '+target+' 在索引 '+foundIdx:(checked.length>=n||hi<lo?'✗ '+target+' 不存在':'查找中...'),W/2,H-12,found?'#34d399':'#fbbf24',12);
};

// --- flowchart: 流程图（增强版）---
SCENES.flowchart = function(t,args){
  const W=cv.width,H=cv.height;
  const nodes=args.nodes||[];
  const edges=args.edges||[];
  const active=args.active!==undefined?args.active:-1;
  const edgeLabels=args.edgeLabels||{};
  drawText(args.title||'算法流程图',W/2,22,'#fff',15);
  if(!nodes.length)return;

  const isAct=function(ni){return active<0||ni===active;};

  // 1) Draw edges first (behind nodes)
  edges.forEach(function(e){
    const from=nodes[e[0]],to=nodes[e[1]];
    if(!from||!to)return;
    const fx=from.x,fy=from.y,fw=from.w,fh=from.h;
    const tx=to.x,ty=to.y,tw=to.w,th=to.h;
    const fcx=fx+fw/2,fcy=fy+fh/2;
    const tcx=tx+tw/2,tcy=ty+th/2;
    const dy=tcy-fcy,dx=tcx-fcx;
    const col=isAct(e[1])?'#34d399':'#475569';
    const lw=isAct(e[1])?2.5:1.5;
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.fillStyle=col;
    const edgeLabel = e.length>2 ? e[2] : (e.label || '');

    let pts=[]; // 路径点序列

    if(Math.abs(dy)<=5){
      // 水平连接
      pts.push([fcx,fcy],[tcx,tcy]);
    }else if(dy>0){
      // 向下：目标在正下方 → 直连；目标偏左→左出；偏右→右出
      if(dx<-fw/2-20){
        const ex=from.x;
        const bendY=(fy+fh+ty)/2;
        pts.push([ex,fcy],[ex,bendY],[tcx,bendY],[tcx,ty]);
      }else if(dx>tw/2+20){
        const ex=from.x+fw;
        const bendY=(fy+fh+ty)/2;
        pts.push([ex,fcy],[ex,bendY],[tcx,bendY],[tcx,ty]);
      }else{
        pts.push([fcx,fy+fh],[tcx,ty]);
      }
    }else{
      // 向上（回环）
      const side = dx>0?'right':'left';
      const ex = side==='right'? from.x+fw+30 : from.x-30;
      const ey = (fy+ty+fh)/2;
      if(side==='right'){
        pts.push([from.x+fw,fcy],[from.x+fw+30,ey],[tx+tw+30,ey],[tx+tw,tcy]);
      }else{
        pts.push([from.x,fcy],[from.x-30,ey],[tx-30,ey],[tx,tcy]);
      }
    }

    // 绘制路径
    if(pts.length===2){
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);ctx.lineTo(pts[1][0],pts[1][1]);ctx.stroke();
    }else if(pts.length===4){
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      ctx.lineTo(pts[1][0],pts[1][1]);
      ctx.lineTo(pts[2][0],pts[2][1]);
      ctx.lineTo(pts[3][0],pts[3][1]);
      ctx.stroke();
    }

    // 箭头头（在最后一段路径末尾）
    const last=pts[pts.length-1],prev=pts[pts.length-2];
    const ang=Math.atan2(last[1]-prev[1],last[0]-prev[0]);
    const aLen=8,aAng=0.5;
    ctx.beginPath();
    ctx.moveTo(last[0],last[1]);
    ctx.lineTo(last[0]-aLen*Math.cos(ang-aAng),last[1]-aLen*Math.sin(ang-aAng));
    ctx.lineTo(last[0]-aLen*Math.cos(ang+aAng),last[1]-aLen*Math.sin(ang+aAng));
    ctx.closePath();ctx.fill();

    // Edge label（如"是/否"）
    if(edgeLabel){
      const midIdx=Math.floor(pts.length/2);
      const mp=pts[midIdx];
      drawText(edgeLabel,mp[0]+(pts[midIdx-1][0]===mp[0]?12:-12),
               mp[1]+(pts[midIdx-1][1]===mp[1]?-8:8),
               isAct(e[1])?'#34d399':'#94a3b8',11,
               pts[midIdx-1][0]===mp[0]?'center':'center');
    }
  });

  // 2) Draw nodes (on top of edges)
  nodes.forEach(function(n){
    const col=n.color||(isAct(n.id)?'#6366f1':'#334155');
    const x=n.x||0,y=n.y||0,w=n.w||140,h=n.h||44;

    // Shadow
    if(isAct(n.id)){
      ctx.shadowColor=col;ctx.shadowBlur=12;
    }

    // Fill
    ctx.fillStyle=isAct(n.id)?col+'55':'rgba(30,41,59,0.6)';
    ctx.strokeStyle=isAct(n.id)?col:'#475569';
    ctx.lineWidth=isAct(n.id)?2.5:1.5;

    if(n.type==='decision'){
      ctx.beginPath();
      ctx.moveTo(x,y+h/2);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w,y+h/2);ctx.lineTo(x+w/2,y+h);
      ctx.closePath();ctx.fill();ctx.stroke();
    }else if(n.type==='io'){
      // 平行四边形（输入/输出）
      const offset=12;
      ctx.beginPath();
      ctx.moveTo(x+offset,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-offset,y+h);ctx.lineTo(x,y+h);
      ctx.closePath();ctx.fill();ctx.stroke();
    }else{
      const r=n.type==='startend'?(h/2):6;
      roundRect(x,y,w,h,r);ctx.fill();ctx.stroke();
    }
    ctx.shadowBlur=0;

    // Label text
    const lines=(n.label||'').split('\n');
    lines.forEach(function(ln,i){
      drawText(ln,x+w/2,y+h/2+(i-(lines.length-1)/2)*16,
               isAct(n.id)?'#fff':'#94a3b8',isAct(n.id)?13:11);
    });
  });
};

// --- complexity_chart: 复杂度对比表 ---
SCENES.complexity_chart = function(t,args){
  const W=cv.width,H=cv.height;
  const items=args.items||[];
  drawText(args.title||'算法复杂度对比',W/2,30,'#fff',16);
  const headers=['算法','最好','最坏','平均','空间','稳定'];
  const colW=[140,80,80,80,70,50];
  const totalW=colW.reduce(function(a,b){return a+b;},0);
  const sx=(W-totalW)/2,sy=60;
  // header
  headers.forEach(function(h,i){
    ctx.fillStyle='#334155';ctx.strokeStyle='var(--line)';ctx.lineWidth=1;
    const x=sx+colW.slice(0,i).reduce(function(a,b){return a+b;},0);
    ctx.fillRect(x,sy,colW[i],32);ctx.strokeRect(x,sy,colW[i],32);
    drawText(h,x+colW[i]/2,sy+16,'#e8eef8',11);
  });
  // rows
  items.forEach(function(m,i){
    const rowY=sy+32+2+i*32;
    const vals=[m.name,m.best||'-',m.worst||'-',m.avg||'-',m.space||'-',m.stable?'✓':'✗'];
    vals.forEach(function(v,j){
      const x=sx+colW.slice(0,j).reduce(function(a,b){return a+b;},0);
      ctx.fillStyle='rgba(255,255,255,0.03)';ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
      ctx.fillRect(x,rowY,colW[j],32);ctx.strokeRect(x,rowY,colW[j],32);
      const c=j===5?(v==='✓'?'#34d399':'#f87171'):(j===0?'#fff':'#94a3b8');
      drawText(v,x+colW[j]/2,rowY+16,c,11);
    });
  });
};

// --- block_diagram: 框图 ---
SCENES.block_diagram = function(t,args){

  drawText(args.title||'结构框图',W/2,25,'#fff',15);
  const blocks=args.blocks||[];
  blocks.forEach(function(b){

    ctx.strokeStyle=b.color||'#6366f1';ctx.lineWidth=2;

    roundRect(b.x,b.y,b.w||120,b.h||50,r);ctx.fill();ctx.stroke();

  });
  const arrows=args.arrows||[];
  arrows.forEach(function(a){

    ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke();
    // arrowhead
    const ang=Math.atan2(a.y2-a.y1,a.x2-a.x1);
    ctx.beginPath();ctx.moveTo(a.x2,a.y2);
    ctx.lineTo(a.x2-8*Math.cos(ang-0.4),a.y2-8*Math.sin(ang-0.4));
    ctx.lineTo(a.x2-8*Math.cos(ang+0.4),a.y2-8*Math.sin(ang+0.4));
    ctx.closePath();ctx.fill();
    if(a.label)drawText(a.label,(a.x1+a.x2)/2,(a.y1+a.y2)/2-8,a.color||'#9ab0d0',10);

// --- data_table: 数据表 ---
SCENES.data_table = function(t,args){

  const totalW=colW*headers.length;

  });

    r.forEach(function(c,ci){

// --- chart: 统计图（柱状/折线/饼图）---
SCENES.chart = function(t,args){
  const W=cv.width,H=cv.height;
  const data=args.data||[],labels=args.labels||[];
  const colors=args.colors||['#6366f1','#fbbf24','#f87171','#34d399','#06b6d4','#a855f7'];
  drawText(args.title||'统计图',W/2,22,'#fff',15);
  if(!data.length)return;
  if(args.type==='pie'){
    const total=data.reduce(function(a,b){return a+b;},0);
    const cx=W/2,cy=H/2+10,r=Math.min(W,H)/2-40;
    let ang=-Math.PI/2;
    data.forEach(function(v,i){
      const a=(v/total)*Math.PI*2;
      ctx.fillStyle=colors[i%colors.length];
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,ang,ang+a);ctx.closePath();ctx.fill();
      if(labels[i]){
        const la=ang+a/2;
        drawText(labels[i],cx+(r+16)*Math.cos(la),cy+(r+16)*Math.sin(la),'#e8eef8',10);
      }
      ang+=a;
    });
  }else{
    const pad={l:50,r:20,t:40,b:40};
    const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
    const max=Math.max.apply(null,data);
    const barW=Math.min(40,cw/data.length-8);
    data.forEach(function(v,i){
      const x=pad.l+i*(cw/data.length)+4;
      const bh=(v/max)*ch*0.85;
      const y=pad.t+ch-bh;
      ctx.fillStyle=colors[i%colors.length];
      if(args.type==='line'){
        ctx.beginPath();ctx.arc(x+barW/2,y,4,0,Math.PI*2);ctx.fill();
        if(i>0){
          const px=pad.l+(i-1)*(cw/data.length)+4+barW/2;
          const py=pad.t+ch-(data[i-1]/max)*ch*0.85;
          ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x+barW/2,y);ctx.strokeStyle=colors[i%colors.length];ctx.lineWidth=2;ctx.stroke();
        }
      }else{
        ctx.fillRect(x,y,barW,bh);
      }
      if(labels[i])drawText(labels[i],x+barW/2,pad.t+ch+12,'#9ab0d0',9);
      drawText(v,x+barW/2,y-6,'#e8eef8',9);
    });
  }
};

// --- neural_net: 神经网络图 ---
SCENES.neural_net = function(t,args){
  const W=cv.width,H=cv.height;
  const layers=args.layers||[];
  drawText(args.title||'神经网络结构',W/2,22,'#fff',15);
  if(!layers.length)return;
  const highlight=args.highlight||[];
  const layerGap=(W-80)/(layers.length+1);
  const maxNeurons=Math.max.apply(null,layers);
  const neuronR=Math.min(20,Math.min(layerGap*0.35,((H-80)/maxNeurons)*0.35));
  // Draw connections
  ctx.strokeStyle='rgba(148,163,184,0.15)';ctx.lineWidth=1;
  for(let li=0;li<layers.length-1;li++){
    const lx=40+layerGap*(li+1),nx=40+layerGap*(li+2);
    const nLeft=layers[li],nRight=layers[li+1];
    for(let ni=0;ni<nLeft;ni++){
      const ly=H/2+(ni-(nLeft-1)/2)*(neuronR*2.5);
      for(let nj=0;nj<nRight;nj++){
        const ny=H/2+(nj-(nRight-1)/2)*(neuronR*2.5);
        ctx.beginPath();ctx.moveTo(lx+neuronR,ly);ctx.lineTo(nx-neuronR,ny);ctx.stroke();
      }
    }
  }
  // Draw neurons
  layers.forEach(function(n,li){
    const x=40+layerGap*(li+1);
    for(let ni=0;ni<n;ni++){
      const y=H/2+(ni-(n-1)/2)*(neuronR*2.5);
      const hl=highlight.length&&highlight[0]===li&&highlight[1]===ni;
      ctx.beginPath();ctx.arc(x,y,neuronR,0,Math.PI*2);
      ctx.fillStyle=hl?'#fbbf24':(args.inputLayer===li?'#6366f1':'#334155');
      ctx.strokeStyle=hl?'#fbbf24':(args.inputLayer===li?'#6366f1':'#475569');
      ctx.lineWidth=hl?3:1.5;ctx.fill();ctx.stroke();
    }
    if(layers.length<=7)drawText('层'+(li+1)+' ('+n+')',x,H-20,'#9ab0d0',10);
  });
};

// --- globe_3d: 3D地球 ---
SCENES.globe_3d = function(t,args){
  const W=cv.width,H=cv.height;
  const mode=args.mode||'rotation';
  const angleT=args.angle!==undefined?args.angle:t*0.3;
  drawText(args.title||(mode==='revolution'?'地球公转':'地球自转'),W/2,20,'#fff',15);
  const cx=W/2,cy=H/2+8;

  if(mode==='revolution'){
    // Orbit
    ctx.strokeStyle='rgba(71,85,105,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(cx,cy,Math.min(W,H)*0.38,Math.min(W,H)*0.2,0,0,Math.PI*2);ctx.stroke();
    // Sun at center
    ctx.beginPath();ctx.arc(cx,cy,25,0,Math.PI*2);
    ctx.fillStyle='rgba(251,191,36,0.3)';ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.fill();ctx.stroke();
    drawText('太阳',cx,cy,'#fbbf24',12);
    // Earth on orbit
    const orbitR=Math.min(W,H)*0.38;
    const ex=cx+orbitR*Math.cos(angleT);
    const ey=cy+orbitR*0.5*Math.sin(angleT);
    ctx.beginPath();ctx.arc(ex,ey,18,0,Math.PI*2);
    ctx.fillStyle='rgba(52,211,153,0.3)';ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.fill();ctx.stroke();
    drawText('地球',ex,ey,'#34d399',9);
    // Tilt line
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.setLineDash([2,2]);
    ctx.beginPath();ctx.moveTo(ex-12,ey-12);ctx.lineTo(ex+12,ey+12);ctx.stroke();ctx.setLineDash([]);
    // Season label
    const season=Math.floor(((angleT%(Math.PI*2))/(Math.PI*2))*4);
    const seasons=['春分','夏至','秋分','冬至'];
    drawText(seasons[season%4],W/2,H-15,'#fbbf24',13);
  }else{
    // Globe as circle with grid lines
    const r=Math.min(W,H)*0.32;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle='rgba(52,211,153,0.06)';ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.fill();ctx.stroke();
    // Latitudes
    for(var lat=-60;lat<=60;lat+=30){
      const yr=Math.sin((90-lat)*Math.PI/180)*r;
      const yr2=Math.sin((90+lat)*Math.PI/180)*r;
      ctx.beginPath();ctx.ellipse(cx,cy,yr,3,0,0,Math.PI*2);
      ctx.strokeStyle='rgba(52,211,153,0.2)';ctx.lineWidth=0.8;ctx.stroke();
    }
    // Longitudes (rotating)
    for(var lon=0;lon<360;lon+=30){
      const a=lon*Math.PI/180+angleT;
      ctx.beginPath();ctx.ellipse(cx,cy,r*Math.cos(a),r,0,0,Math.PI*2);
      ctx.strokeStyle='rgba(52,211,153,0.15)';ctx.lineWidth=0.8;ctx.stroke();
    }
    // Axis
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(cx,cy-r-10);ctx.lineTo(cx,cy+r+10);ctx.stroke();ctx.setLineDash([]);
    drawText('N',cx,cy-r-18,'#fff',10);
    drawText('S',cx,cy+r+18,'#fff',10);
    // Day/night terminator
    ctx.fillStyle='rgba(15,23,42,0.2)';
    ctx.beginPath();ctx.ellipse(cx,cy,r*0.3,r,0,0,Math.PI*2);ctx.fill();
    drawText('自转方向 →',cx+r+40,cy,'#94a3b8',11);
    // Arrow
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx+r+15,cy);ctx.lineTo(cx+r+35,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+r+32,cy-4);ctx.lineTo(cx+r+38,cy);ctx.lineTo(cx+r+32,cy+4);ctx.stroke();
  }
};

// --- atmosphere: 大气环流 / 气压带风带 ---
SCENES.atmosphere = function(t,args){
  const W=cv.width,H=cv.height;
  const type=args.type||'global';
  drawText(args.title||'大气环流',W/2,18,'#fff',15);
  const cx=W/2;

  if(type==='global'){
    // Simplified global circulation: 3 cells per hemisphere
    const topY=40,botY=H-30,cellH=(botY-topY)/6;
    // Pressure belts
    const belts=['极地高压','副极地低压','副热带高压','赤道低压','副热带高压','副极地低压','极地高压'];
    const beltColors=['#3b82f6','#f87171','#fbbf24','#ef4444','#fbbf24','#f87171','#3b82f6'];
    belts.forEach(function(b,i){
      const y=topY+i*cellH-cellH/2;
      ctx.fillStyle=beltColors[i]+'22';
      ctx.strokeStyle=beltColors[i];ctx.lineWidth=1;
      ctx.fillRect(10,y,W-20,cellH);
      ctx.strokeRect(10,y,W-20,cellH);
      drawText(b,cx,y+cellH/2,'#fff',10);
    });
    // Cells arrows
    const cells=[{dir:-1,from:0,to:2},{dir:1,from:2,to:4},{dir:-1,from:4,to:6}];
    cells.forEach(function(c){
      const cy0=topY+c.from*cellH+cellH*0.5;
      const cy1=topY+c.to*cellH-cellH*0.5;
      ctx.strokeStyle='rgba(148,163,184,0.3)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(cx+40,cy0);ctx.quadraticCurveTo(cx+80,(cy0+cy1)/2,cx+40,cy1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-40,cy0);ctx.quadraticCurveTo(cx-80,(cy0+cy1)/2,cx-40,cy1);ctx.stroke();
    });
  }else if(type==='wind'){
    // Wind patterns: trade winds, westerlies, polar easterlies
    const topY=50,botY=H-30,cellH=(botY-topY)/6;
    const cells=[{n:'极地东风',from:0,to:1},{n:'盛行西风',from:2,to:3},{n:'东北信风',from:3,to:4},
                 {n:'东南信风',from:4,to:5},{n:'盛行西风',from:5,to:6},{n:'极地东风',from:6,to:7}];
    cells.forEach(function(c,ci){
      const y0=topY+c.from*cellH+cellH*0.3;
      const y1=topY+c.to*cellH-cellH*0.3;
      const dir=ci<3?-1:1;
      const xs=dir>0?W*0.15:W*0.85;
      const xe=dir>0?W*0.85:W*0.15;
      ctx.strokeStyle='#06b6d4';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(xs,y0);ctx.quadraticCurveTo(cx,(y0+y1)/2,xe,y1);ctx.stroke();
      drawText(c.n,cx,(y0+y1)/2,'#06b6d4',11);
    });
    // Pressure labels
    const pLabels=['90°N 极地高压','60°N 副极地低压','30°N 副热带高压','0° 赤道低压','30°S 副热带高压','60°S 副极地低压','90°S 极地高压'];
    pLabels.forEach(function(p,i){
      drawText(p,W*0.12,topY+i*cellH+cellH/2,'#94a3b8',9,'left');
    });
  }else if(type==='seasonal'){
    // Seasonal monsoon winds
    var season=args.season||'summer';
    var isSummer=season==='summer';
    ctx.strokeStyle='rgba(71,85,105,0.2)';ctx.lineWidth=1;
    // Land (right) / Sea (left)
    ctx.fillStyle=isSummer?'rgba(251,146,60,0.1)':'rgba(96,165,250,0.1)';
    ctx.fillRect(cx,40,cx-20,H-70);
    ctx.fillStyle=isSummer?'rgba(96,165,250,0.1)':'rgba(251,146,60,0.1)';
    ctx.fillRect(20,40,cx-20,H-70);
    drawText('海洋',cx/2,H-20,'#60a5fa',12);
    drawText('陆地',cx+W/4,H-20,'#fb923c',12);
    // Arrow
    const startX=isSummer?cx/2:cx+W/4;
    const endX=isSummer?cx+W/4:cx/2;
    ctx.strokeStyle='#06b6d4';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(startX,cy);ctx.lineTo(endX,cy);ctx.stroke();
    ctx.fillStyle='#06b6d4';
    const aDir=isSummer?1:-1;
    ctx.beginPath();ctx.moveTo(endX,cy);ctx.lineTo(endX-aDir*12,cy-6);ctx.lineTo(endX-aDir*12,cy+6);ctx.closePath();ctx.fill();
    drawText(isSummer?'夏季风 (海→陆)':'冬季风 (陆→海)',cx,cy-20,'#06b6d4',13);
    drawText(isSummer?'高温低压':'低温高压',cx+W/4,cy+25,'#fbbf24',10);
    drawText(isSummer?'低温高压':'高温低压',cx/2,cy+25,'#60a5fa',10);
  }
};

// --- water_cycle: 水循环 ---
SCENES.water_cycle = function(t,args){
  const W=cv.width,H=cv.height;
  const active=args.active!==undefined?args.active:-1;
  drawText(args.title||'水循环',W/2,18,'#fff',15);
  const cx=W/2;
  // Sky
  ctx.fillStyle='rgba(6,182,212,0.04)';ctx.fillRect(0,30,W,H*0.45);
  // Clouds
  [[cx-80,80,60,25],[cx+30,60,70,22],[cx-40,110,50,20]].forEach(function(cl){
    ctx.fillStyle='rgba(148,163,184,0.15)';ctx.beginPath();
    ctx.ellipse(cl[0],cl[1],cl[2],cl[3],0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cl[0]-15,cl[1]+5,cl[2]*0.6,cl[3]*0.7,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cl[0]+15,cl[1]+3,cl[2]*0.5,cl[3]*0.6,0,0,Math.PI*2);ctx.fill();
  });
  // Precipitation (rain)
  if(active<0||active===0){
    ctx.strokeStyle='rgba(6,182,212,0.3)';ctx.lineWidth=1;
    for(var ri=0;ri<20;ri++){
      var rx=cx-70+Math.random()*140,ry=100+Math.random()*40;
      ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+12);ctx.stroke();
    }
    drawText('降水',cx+100,115,'#06b6d4',11);
  }
  // Ocean
  ctx.fillStyle='rgba(6,182,212,0.1)';ctx.strokeStyle='rgba(6,182,212,0.2)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(cx,H-60,W*0.42,45,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  drawText('海洋',cx-30,H-60,'#06b6d4',12);
  // Evaporation
  if(active<0||active===1){
    for(var ei=0;ei<8;ei++){
      var ex=cx-50+ei*15,ey=H-90-ei*6+Math.sin(t+ei)*3;
      ctx.fillStyle='rgba(148,163,184,0.3)';ctx.beginPath();ctx.arc(ex,ey,3,0,Math.PI*2);ctx.fill();
    }
    drawText('蒸发',cx-80,H-90,'#94a3b8',11);
  }
  // Land / mountain
  ctx.fillStyle='rgba(52,211,153,0.08)';ctx.strokeStyle='rgba(52,211,153,0.2)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx-120,H-110);ctx.lineTo(cx-30,H-135);ctx.lineTo(cx+20,H-125);
  ctx.lineTo(cx+80,H-140);ctx.lineTo(cx+120,H-115);ctx.lineTo(cx+150,H-100);
  ctx.lineTo(cx+150,H-10);ctx.lineTo(cx-120,H-10);ctx.closePath();ctx.fill();ctx.stroke();
  drawText('陆地',cx+80,H-30,'#34d399',12);
  // Runoff (river)
  if(active<0||active===2){
    ctx.strokeStyle='rgba(6,182,212,0.3)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx+20,H-125);ctx.quadraticCurveTo(cx+30,H-90,cx,H-70);
    ctx.quadraticCurveTo(cx-20,H-55,cx+40,H-45);ctx.stroke();
    drawText('径流',cx+50,H-70,'#06b6d4',11);
  }
  // Underground
  if(active<0||active===3){
    ctx.strokeStyle='rgba(6,182,212,0.15)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(cx-60,H-105);ctx.quadraticCurveTo(cx-20,H-65,cx-40,H-55);ctx.stroke();
    ctx.setLineDash([]);
    drawText('下渗',cx-60,H-110,'#06b6d4',10);
  }
};

// --- plate_tectonics: 板块构造 ---
SCENES.plate_tectonics = function(t,args){
  const W=cv.width,H=cv.height;
  const type=args.type||'convergent';
  drawText(args.title||'板块构造 · '+(type==='convergent'?'汇聚边界':type==='divergent'?'张裂边界':'转换边界'),W/2,18,'#fff',14);
  const cy=H/2+20;
  // Earth crust background
  ctx.fillStyle='rgba(251,146,60,0.04)';ctx.fillRect(10,cy-15,W-20,80);
  // Mantle
  ctx.fillStyle='rgba(251,146,60,0.08)';ctx.fillRect(10,cy+35,W-20,H-cy-45);
  // Asthenosphere arrows
  ctx.strokeStyle='rgba(251,146,60,0.15)';ctx.lineWidth=1;
  for(var ai=0;ai<8;ai++){
    var ax=20+ai*((W-40)/8),ay=cy+50+Math.sin(t+ai)*5;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax,ay+10);ctx.stroke();
  }

  if(type==='convergent'){
    // Two plates converging
    ctx.fillStyle='rgba(251,146,60,0.2)';ctx.strokeStyle='#fb923c';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx-60,cy);ctx.lineTo(cx-10,cy-35);ctx.lineTo(cx-10,cy);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(99,102,241,0.2)';ctx.strokeStyle='#6366f1';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx+60,cy);ctx.lineTo(cx+10,cy-35);ctx.lineTo(cx+10,cy);ctx.closePath();ctx.fill();ctx.stroke();
    // Subducting plate
    ctx.strokeStyle='rgba(99,102,241,0.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(cx+10,cy-35);ctx.quadraticCurveTo(cx+20,cy+20,cx-20,cy+60);ctx.stroke();ctx.setLineDash([]);
    // Volcano / mountain
    ctx.fillStyle='rgba(239,68,68,0.15)';ctx.strokeStyle='#ef4444';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx-35,cy-35);ctx.lineTo(cx-20,cy-65);ctx.lineTo(cx-10,cy-40);ctx.lineTo(cx,cy-50);
    ctx.lineTo(cx+5,cy-35);ctx.closePath();ctx.fill();ctx.stroke();
    drawText('火山/山脉',cx-20,cy-75,'#ef4444',10);
    // Labels
    drawText('大洋板块',cx+80,cy-8,'#6366f1',11);
    drawText('大陆板块',cx-80,cy-8,'#fb923c',11);
    drawText('板块俯冲',cx+40,cy+55,'#94a3b8',10);
    // Convergence arrows
    ctx.strokeStyle='#f87171';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx-90,cy-20);ctx.lineTo(cx-70,cy-20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-73,cy-24);ctx.lineTo(cx-70,cy-20);ctx.lineTo(cx-73,cy-16);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+90,cy-20);ctx.lineTo(cx+70,cy-20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+73,cy-24);ctx.lineTo(cx+70,cy-20);ctx.lineTo(cx+73,cy-16);ctx.stroke();
  }else if(type==='divergent'){
    // Two plates separating
    ctx.fillStyle='rgba(251,146,60,0.2)';ctx.strokeStyle='#fb923c';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(20,cy);ctx.lineTo(cx-40,cy-35);ctx.lineTo(cx-40,cy);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(99,102,241,0.2)';ctx.strokeStyle='#6366f1';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W-20,cy);ctx.lineTo(cx+40,cy-35);ctx.lineTo(cx+40,cy);ctx.closePath();ctx.fill();ctx.stroke();
    // Magma upwelling
    ctx.fillStyle='rgba(251,191,36,0.15)';ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx-15,cy+60);ctx.lineTo(cx-5,cy-20);ctx.lineTo(cx+5,cy-20);ctx.lineTo(cx+15,cy+60);ctx.closePath();ctx.fill();ctx.stroke();
    drawText('岩浆上涌',cx,cy-30,'#fbbf24',10);
    drawText('大洋中脊',cx,cy+10,'#fbbf24',11);
    // Divergence arrows
    ctx.strokeStyle='#34d399';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx-70,cy-20);ctx.lineTo(cx-90,cy-20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-87,cy-24);ctx.lineTo(cx-90,cy-20);ctx.lineTo(cx-87,cy-16);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+70,cy-20);ctx.lineTo(cx+90,cy-20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+87,cy-24);ctx.lineTo(cx+90,cy-20);ctx.lineTo(cx+87,cy-16);ctx.stroke();
  }else if(type==='transform'){
    // Transform boundary
    ctx.fillStyle='rgba(251,146,60,0.2)';ctx.strokeStyle='#fb923c';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(20,cy-15);ctx.lineTo(W-20,cy-15);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(99,102,241,0.2)';ctx.strokeStyle='#6366f1';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(20,cy+15);ctx.lineTo(W-20,cy+15);ctx.closePath();ctx.fill();ctx.stroke();
    // Fault line
    ctx.strokeStyle='#f87171';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(cx,cy-15);ctx.lineTo(cx,cy+15);ctx.stroke();
    // Opposite direction arrows
    ctx.strokeStyle='#f87171';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx-90,cy-30);ctx.lineTo(cx-70,cy-30);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-73,cy-34);ctx.lineTo(cx-70,cy-30);ctx.lineTo(cx-73,cy-26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+70,cy+30);ctx.lineTo(cx+90,cy+30);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+87,cy+26);ctx.lineTo(cx+90,cy+30);ctx.lineTo(cx+87,cy+34);ctx.stroke();
    drawText('转换断层',cx,cy-30,'#f87171',11);
    drawText('地震多发',cx,cy+35,'#f87171',10);
  }
};

// --- population_pyramid: 人口金字塔 ---
SCENES.population_pyramid = function(t,args){
  const W=cv.width,H=cv.height;
  const data=args.data||{male:[],female:[]};
  const labels=args.labels||[];
  drawText(args.title||'人口金字塔',W/2,18,'#fff',15);
  const male=data.male||[],female=data.female||[];
  const n=Math.max(male.length,female.length);
  if(!n)return;
  const maxVal=Math.max(Math.max.apply(null,male),Math.max.apply(null,female));
  const barH=Math.min(40,(H-80)/n);
  const totalW=W*0.7;
  const cx=W/2;
  const leftEdge=cx-totalW/2;

  // Center axis
  ctx.strokeStyle='rgba(71,85,105,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx,40);ctx.lineTo(cx,40+n*barH);ctx.stroke();

  // Age group labels
  labels.forEach(function(l,i){
    if(i>=n)return;
    const y=40+i*barH+barH/2;
    drawText(l,cx,y+2,'#94a3b8',9,'center');
  });

  // Male bars (left side)
  male.forEach(function(v,i){
    const y=40+i*barH;
    const bw=(v/maxVal)*(totalW/2-10);
    ctx.fillStyle='rgba(96,165,250,0.5)';
    ctx.fillRect(cx-bw,y+2,bw,barH-4);
    if(v>0)drawText(v,cx-bw-8,y+barH/2+1,'#60a5fa',8,'center');
  });

  // Female bars (right side)
  female.forEach(function(v,i){
    const y=40+i*barH;
    const bw=(v/maxVal)*(totalW/2-10);
    ctx.fillStyle='rgba(251,146,60,0.5)';
    ctx.fillRect(cx+1,y+2,bw,barH-4);
    if(v>0)drawText(v,cx+bw+8,y+barH/2+1,'#fb923c',8,'center');
  });

  // Labels
  drawText('男',cx-totalW/4,30,'#60a5fa',12);
  drawText('女',cx+totalW/4,30,'#fb923c',12);
  ctx.fillStyle='#64748b';ctx.font='9px sans-serif';ctx.textAlign='center';
  ctx.fillText('← 人数',cx-totalW/2-5,30);
  ctx.fillText('人数 →',cx+totalW/2+5,30);
};

// --- urban_model: 城市结构模型 ---
SCENES.urban_model = function(t,args){
  const W=cv.width,H=cv.height;
  const type=args.type||'concentric';
  drawText(args.title||'城市结构模型',W/2,18,'#fff',15);
  const cx=W/2,cy=H/2+8;

  if(type==='concentric'){
    // Concentric zone model
    const zones=[
      {r:28,label:'中心\n商业区',col:'#f87171'},
      {r:55,label:'过渡带',col:'#fb923c'},
      {r:82,label:'工人\n住宅区',col:'#fbbf24'},
      {r:110,label:'中产\n住宅区',col:'#34d399'},
      {r:140,label:'通勤区',col:'#6366f1'},
    ];
    zones.forEach(function(z){
      ctx.fillStyle=z.col+'22';ctx.strokeStyle=z.col;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(cx,cy,z.r,0,Math.PI*2);ctx.fill();ctx.stroke();
      drawText(z.label,cx,cy,'#fff',z.r<40?8:10);
    });
    drawText('同心圆模型',cx,H-15,'#94a3b8',10);
  }else if(type==='sector'){
    // Sector model
    const sectors=[
      {a1:-0.3,a2:0.3,r:140,label:'高级住宅',col:'#34d399'},
      {a1:0.3,a2:1.0,r:120,label:'中级住宅',col:'#fbbf24'},
      {a1:1.0,a2:1.8,r:100,label:'工业区',col:'#f87171'},
      {a1:1.8,a2:2.5,r:120,label:'低级住宅',col:'#fb923c'},
      {a1:2.5,a2:2.9,r:130,label:'商业区',col:'#6366f1'},
    ];
    // CBD center
    ctx.fillStyle='rgba(239,68,68,0.2)';ctx.strokeStyle='#ef4444';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);ctx.fill();ctx.stroke();
    drawText('CBD',cx,cy,'#fff',9);
    sectors.forEach(function(s){
      ctx.fillStyle=s.col+'22';ctx.strokeStyle=s.col;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,s.r,s.a1,s.a2);ctx.closePath();ctx.fill();ctx.stroke();
      // Label at sector centroid
      var ma=(s.a1+s.a2)/2;
      var lx=cx+Math.cos(ma)*s.r*0.6;
      var ly=cy+Math.sin(ma)*s.r*0.6;
      drawText(s.label,lx,ly,'#fff',10);
    });
    drawText('扇形模型',cx,H-15,'#94a3b8',10);
  }else if(type==='multiple'){
    // Multiple nuclei model
    var nuclei=[
      {x:0.5,y:0.5,r:30,label:'CBD',col:'#f87171'},
      {x:0.2,y:0.2,r:25,label:'轻工业',col:'#fb923c'},
      {x:0.8,y:0.2,r:22,label:'重工业',col:'#f87171'},
      {x:0.25,y:0.7,r:28,label:'住宅区',col:'#fbbf24'},
      {x:0.75,y:0.7,r:25,label:'郊区\n住宅',col:'#34d399'},
      {x:0.5,y:0.15,r:20,label:'商业区',col:'#6366f1'},
    ];
    nuclei.forEach(function(n){
      var nx=n.x*W,ny=n.y*H;
      ctx.fillStyle=n.col+'22';ctx.strokeStyle=n.col;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(nx,ny,n.r,0,Math.PI*2);ctx.fill();ctx.stroke();
      drawText(n.label,nx,ny,'#fff',9);
    });
    drawText('多核心模型',cx,H-15,'#94a3b8',10);
  }
};

        var px=p[0]*W*0.9+W*0.05,py=p[1]*H*0.8+H*0.08;

// --- gis_layers: GIS图层 ---
SCENES.gis_layers = function(t,args){
  const W=cv.width,H=cv.height;
  const layers=args.layers||['遥感影像','地形图','行政区划','交通路网','专题数据'];
  drawText(args.title||'GIS 图层叠加',W/2,18,'#fff',15);
  const cx=W/2,cy=H/2+8;
  const nLayers=layers.length;
  const layerH=Math.min(50,(H-60)/nLayers);
  const totalH=nLayers*(layerH+4);
  const startY=cy-totalH/2;
  const bw=Math.min(W*0.6,300);
  const bx=cx-bw/2;

  // Stack layers with offset
  var layerColors=['#f87171','#fb923c','#fbbf24','#34d399','#6366f1','#06b6d4','#a78bfa'];
  layers.forEach(function(l,i){
    var ly=startY+i*(layerH+4);
    var offset=(nLayers-1-i)*3;
    ctx.fillStyle=layerColors[i%layerColors.length]+'22';
    ctx.strokeStyle=layerColors[i%layerColors.length];ctx.lineWidth=1.5;
    roundRect(bx+offset,ly+offset,bw,layerH,6);ctx.fill();ctx.stroke();
    drawText(l,bx+bw/2,ly+offset+layerH/2,'#fff',12);
  });

  // Bottom result layer
  var rY=startY+nLayers*(layerH+4)+8;
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;
  roundRect(bx,rY,bw,30,6);ctx.fill();ctx.stroke();
  drawText('综合叠加分析 → 决策支持',bx+bw/2,rY+15,'#fbbf24',12);

  // Info text
  ctx.fillStyle='#64748b';ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText('GIS 核心思想：不同图层叠加，发现空间关系和规律',cx,H-15);
};
const STEPS=_DATA.steps||[];
const STEP_DURATION=3.5;
let stepIdx=0,playing=false,lastT=0,speed=1,stepTime=0,t=0,paramVal=0;

function getSceneArgs(s){
  const a=JSON.parse(JSON.stringify(s.sceneArgs||{}));
  if(a.param&&a.param.name){a.progress=paramVal;}
  return a;
}

function syncStep(){
  const s=STEPS[stepIdx];
  if(!s){statusEl.textContent='完成';return;}
  stepBadge.textContent=s.tag||'';
  stepTitle.textContent=s.name||'';
  stepBody.innerHTML=s.body||'';
  if(s.points){
    stepPoints.innerHTML='<h4>'+(s.points.title||'')+'</h4><ul>'+(s.points.items||[]).map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
  }else stepPoints.innerHTML='';
  document.querySelectorAll('.step').forEach(function(el,i){el.classList.toggle('active',i===stepIdx);});
  statusEl.textContent='步骤 '+(stepIdx+1)+' / '+STEPS.length+(s.name?' · '+s.name:'');
  stepTime=0;

  // Param area
  const sa=s.sceneArgs||{};
  if(sa.param){
    paramArea.style.display='block';
    paramLabel.textContent=sa.param.name;
    paramSlider.min=sa.param.min||0;
    paramSlider.max=sa.param.max||1;
    paramSlider.step=sa.param.step||0.01;
    paramSlider.value=sa.param.value!==undefined?sa.param.value:0;
    paramVal=parseFloat(paramSlider.value);
    paramReadout.textContent=paramVal;
    if(sa.readouts){
      paramStats.innerHTML=sa.readouts.map(function(r){return '<div class="stat-row"><span>'+r.label+'</span><span>'+r.value+'</span></div>';}).join('');
    }else paramStats.innerHTML='';
  }else{
    paramArea.style.display='none';
    paramVal=0;
  }

  // Code
  if(sa.code)showCode(sa.code.lines,sa.code.highlightLine);
  else hideCode();
  draw();
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const s=STEPS[stepIdx];
  if(!s)return;
  const sceneFn=SCENES[s.scene];
  if(sceneFn)sceneFn(t,getSceneArgs(s));
  else{drawText('场景: '+s.scene,cv.width/2,cv.height/2-10,'#9ab0d0',16);drawText(s.name||'',cv.width/2,cv.height/2+20,'#fff',14);}
}

function update(dt){
  t+=dt*speed;if(!playing)return;
  const s=STEPS[stepIdx];
  if(!s)return;
  const sa=s.sceneArgs||{};
  if(sa.param){
    // 交互模式：param 驱动
    const sliderVal=parseFloat(paramSlider.value);
    if(sliderVal<paramSlider.max){
      const inc=parseFloat(paramSlider.step)*speed*dt*3;
      paramSlider.value=Math.min(paramSlider.max,parseFloat(paramSlider.value)+inc);
      paramVal=parseFloat(paramSlider.value);
      paramReadout.textContent=paramVal.toFixed(2);
    }else if(stepIdx<STEPS.length-1){
      stepIdx++;syncStep();
    }else{playing=false;playBtn.textContent='▶ 播放';statusEl.textContent='课程完成！';}
  }else{
    // 自动播放模式
    stepTime+=dt*speed;
    if(stepTime>=STEP_DURATION){
      if(stepIdx<STEPS.length-1){stepIdx++;syncStep();}
      else{playing=false;playBtn.textContent='▶ 播放';statusEl.textContent='课程完成！';}
    }
  }
}

function loop(ts){
  if(!lastT)lastT=ts;const dt=(ts-lastT)/1000;lastT=ts;
  update(dt);draw();requestAnimationFrame(loop);
}

// ===================================================================
// 4) Controls
// ===================================================================
const playBtn=document.getElementById('playBtn'),resetBtn=document.getElementById('resetBtn');
const stepBackBtn=document.getElementById('stepBackBtn'),stepFwdBtn=document.getElementById('stepFwdBtn');
playBtn.onclick=function(){playing=!playing;playBtn.textContent=playing?'⏸ 暂停':'▶ 播放';};
resetBtn.onclick=function(){stepIdx=0;playing=false;syncStep();draw();playBtn.textContent='▶ 播放';};
stepFwdBtn.onclick=function(){if(stepIdx<STEPS.length-1){stepIdx++;syncStep();draw();}};
stepBackBtn.onclick=function(){if(stepIdx>0){stepIdx--;syncStep();draw();}};
speedInp.oninput=function(){speed=parseFloat(speedInp.value);};
paramSlider.oninput=function(){paramVal=parseFloat(this.value);paramReadout.textContent=paramVal;draw();};

// Step bar
const bar=document.getElementById('stepbar');
STEPS.forEach(function(s,i){
  const el=document.createElement('div');
  el.className='step'+(i===stepIdx?' active':'');
  el.innerHTML='<div>'+s.tag+'</div><div>'+(s.name&&s.name.length>8?s.name.slice(0,7)+'…':s.name||'')+'</div>';
  el.onclick=function(){stepIdx=i;syncStep();draw();};
  bar.appendChild(el);
});
syncStep();
requestAnimationFrame(loop);
</script>
